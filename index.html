function getOnboardingSteps(user) {
  const email = (user.email||'').toLowerCase();
  if(email === 'ram@mka.com') return ONBOARDING_STEPS.ram;
  if(email === 'asha@mka.com') return ONBOARDING_STEPS.asha;
  if(user.role === 'employee') return ONBOARDING_STEPS.employee;
  if(user.role === 'accountant') return ONBOARDING_STEPS.accountant;
  if(user.role === 'admin') return ONBOARDING_STEPS.admin;
  return ONBOARDING_STEPS.owner;
}

/* ── SETUP LOADER COMPONENT ── */
function SetupLoader({user, onDone}) {
  const [progress, setProgress] = useState(0);
  const [doneSteps, setDoneSteps] = useState([]);
  const [fadingOut, setFadingOut] = useState(false);

  const getRoleLabel = () => {
    const email = (user.email||'').toLowerCase();
    if(email==='ram@mka.com') return 'Senior Owner';
    if(email==='asha@mka.com') return 'Owner';
    if(user.role==='admin') return 'Administrator';
    return user.role.charAt(0).toUpperCase()+user.role.slice(1);
  };

  const STEPS = [
    {icon:'◈', label:'Loading your dashboard'},
    {icon:'▣', label:'Syncing product catalog'},
    {icon:'◻', label:'Preparing your workspace'},
    {icon:'✦', label:'Almost ready'},
  ];

  useEffect(() => {
    // Step reveals: 0.3s, 0.7s, 1.1s, 1.5s (match CSS delays)
    // Progress bar fills over ~2.2s then fades out
    const stepTimings = [600, 1000, 1400, 1800];
    const timers = stepTimings.map((delay, i) =>
      setTimeout(() => {
        setDoneSteps(prev => [...prev, i]);
        setProgress(((i + 1) / STEPS.length) * 100);
      }, delay)
    );

    // Start fade-out at 2.3s, call onDone at 2.85s
    const fadeTimer = setTimeout(() => setFadingOut(true), 2300);
    const doneTimer = setTimeout(() => onDone(), 2850);

    return () => {
      timers.forEach(clearTimeout);
      clearTimeout(fadeTimer);
      clearTimeout(doneTimer);
    };
  }, []);

  return React.createElement('div', {className: 'setup-screen' + (fadingOut ? ' fading-out' : '')},
    React.createElement('div', {className:'setup-logo-row'},
      React.createElement('span', {className:'setup-logo-icon'}, '⚙'),
      React.createElement('span', {className:'setup-logo-text'}, 'MKA ERP')
    ),
    React.createElement('div', {className:'setup-greeting'},
      'Setting up for ' + user.name + ' · ' + getRoleLabel()
    ),
    React.createElement('div', {className:'setup-steps-list'},
      STEPS.map((s, i) => {
        const done = doneSteps.includes(i);
        return React.createElement('div', {key:i, className:'setup-step-row'},
          React.createElement('div', {className:'setup-step-icon' + (done ? ' done' : '')}, s.icon),
          React.createElement('span', {className:'setup-step-label' + (done ? ' done' : '')}, s.label),
          React.createElement('span', {className:'setup-step-check' + (done ? ' show' : '')}, '✓')
        );
      })
    ),
    React.createElement('div', {className:'setup-bar-wrap'},
      React.createElement('div', {className:'setup-bar-fill', style:{width: progress + '%'}})
    ),
    React.createElement('div', {className:'setup-dots'},
      [0,1,2].map(i => React.createElement('div', {key:i, className:'setup-dot'}))
    )
  );
}

function OnboardingFlow({user, onComplete}) {
  const steps = getOnboardingSteps(user);
  const [step, setStep] = useState(0);
  const [completing, setCompleting] = useState(false);
  const [showLoader, setShowLoader] = useState(false);
  const current = steps[step];
  const isLast = step === steps.length - 1;

  function handleNext() {
    if(isLast) {
      finish();
    } else {
      setStep(s => s + 1);
    }
  }

  function finish() {
    if(completing) return;
    setCompleting(true);
    // Fire backend call immediately (non-blocking for UX)
    const updatedUser = {...user, new_user: false};
    localStorage.setItem('user', JSON.stringify(updatedUser));
    fetch('https://mkaerp-production.up.railway.app/users/'+user.id+'/complete-onboarding', {
      method: 'POST',
      headers: {'Content-Type':'application/json'}
    }).catch(() => {});
    // Show the loader — it will call onComplete when its animation finishes
    setShowLoader(true);
  }

  const getRoleLabel = () => {
    const email = (user.email||'').toLowerCase();
    if(email==='ram@mka.com') return 'Senior Owner';
    if(email==='asha@mka.com') return 'Owner';
    if(user.role==='admin') return 'Administrator';
    return user.role.charAt(0).toUpperCase()+user.role.slice(1);
  };

  // Show loader screen once finish() is called
  if(showLoader)
    return React.createElement(SetupLoader, {
      user,
      onDone: () => onComplete({...user, new_user: false})
    });

  return React.createElement('div', {className:'onboard-overlay'},
    React.createElement('div', {className:'onboard-card'},
      // Header
      React.createElement('div', null,
        React.createElement('div', {className:'onboard-logo'}, '⚙ MKA ERP'),
        React.createElement('div', {className:'onboard-subtitle'}, 'Welcome, '+user.name+' · '+getRoleLabel())
      ),

      // Progress dots
      React.createElement('div', {className:'onboard-step-pill'},
        steps.map((_, i) =>
          React.createElement('div', {
            key:i,
            className:'onboard-dot'+(i===step?' active':i<step?' done':'')
          })
        )
      ),

      // Step content
      React.createElement('div', null,
        React.createElement('span', {className:'onboard-icon'}, current.icon),
        React.createElement('div', {className:'onboard-feature-name'}, current.name),
        React.createElement('div', {className:'onboard-feature-desc'}, current.desc),

        // Screen preview
        React.createElement('div', {className:'onboard-screen'},
          React.createElement('div', {className:'onboard-screen-title'}, 'What you\'ll see'),
          current.preview.map((row, i) =>
            React.createElement('div', {key:i, className:'onboard-screen-row'},
              React.createElement('span', {className:'onboard-screen-icon'}, row.icon),
              React.createElement('span', null, row.label)
            )
          )
        )
      ),

      // Actions
      React.createElement('div', {className:'onboard-actions'},
        React.createElement('div', null,
          React.createElement('div', {className:'onboard-progress'}, (step+1)+' / '+steps.length),
          React.createElement('button', {className:'onboard-skip', onClick:finish}, completing?'Saving…':'Skip tour')
        ),
        React.createElement('button', {
          className:'onboard-next',
          onClick:handleNext,
          disabled:completing
        }, completing ? 'Starting…' : isLast ? 'Get Started →' : 'Next →')
      )
    )
  );
}

/* ── AUDIT LOG HELPER ── */
const BASE_URL = 'https://mkaerp-production.up.railway.app';

function logAction(user, category, action, meta) {
  if(!user) return;
  const now = new Date();
  const hh = now.getHours();
  const mm = String(now.getMinutes()).padStart(2,'0');
  const ampm = hh >= 12 ? 'PM' : 'AM';
  const hh12 = String(hh % 12 || 12);
  const time = hh12 + ':' + mm + ampm;
  const dd = String(now.getDate()).padStart(2,'0');
  const mo = String(now.getMonth()+1).padStart(2,'0');
  const yyyy = now.getFullYear();
  const date = dd + '/' + mo + '/' + yyyy;
  fetch(BASE_URL + '/audit-log', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      user_id: user.id,
      user_name: user.name,
      category,
      action,
      meta: meta || null,
      time_label: time,
      date_label: date,
      ts: now.toISOString()
    })
  }).catch(()=>{});
}

/* ── VAT REPORT PAGE ──────────────────────────────────────────
   Owner & admin only.
   Shows a monthly VAT summary table built from approved invoices.
   VAT is 5% of the subtotal (total / 1.05 × 0.05).
   Exports a multi-sheet .xlsx via SheetJS (CDN, no server call).
   ──────────────────────────────────────────────────────────── */
function VATReportPage({user,data}){
  const R=React.createElement;
  const VAT_RATE=0.05;

  const [year,setYear]=useState(new Date().getFullYear());
  const [exporting,setExporting]=useState(false);

  // All approved invoices contribute to VAT (regardless of accountantSent)
  const invoices=(data.documents||[]).filter(d=>
    d.type==='invoice'&&d.status==='approved'
  );

  // Group by year-month
  const MONTHS=['January','February','March','April','May','June',
                'July','August','September','October','November','December'];

  const byMonth=Array.from({length:12},(_,i)=>{
    const monthInvs=invoices.filter(inv=>{
      if(!inv.created)return false;
      const d=new Date(inv.created);
      return d.getFullYear()===year&&d.getMonth()===i;
    });
    const grossTotal=monthInvs.reduce((s,inv)=>s+Number(inv.total||0),0);
    // total already includes VAT: gross = subtotal * 1.05
    const subtotal=grossTotal/1.05;
    const vat=grossTotal-subtotal;
    return{
      month:MONTHS[i],
      monthNum:i+1,
      count:monthInvs.length,
      grossTotal,
      subtotal,
      vat,
      invoices:monthInvs
    };
  });

  const totals=byMonth.reduce((acc,m)=>({
    count:acc.count+m.count,
    grossTotal:acc.grossTotal+m.grossTotal,
    subtotal:acc.subtotal+m.subtotal,
    vat:acc.vat+m.vat
  }),{count:0,grossTotal:0,subtotal:0,vat:0});

  // Available years from data
  const years=[...new Set(invoices.map(inv=>{
    if(!inv.created)return null;
    return new Date(inv.created).getFullYear();
  }).filter(Boolean))].sort((a,b)=>b-a);
  if(!years.includes(new Date().getFullYear()))years.unshift(new Date().getFullYear());

  // ── Excel export via SheetJS ──
  const exportExcel=async()=>{
    setExporting(true);
    try{
      // Load SheetJS dynamically from CDN if not present
      if(!window.XLSX){
        await new Promise((res,rej)=>{
          const s=document.createElement('script');
          s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
          s.onload=res; s.onerror=rej;
          document.head.appendChild(s);
        });
      }
      const XLSX=window.XLSX;
      const wb=XLSX.utils.book_new();

      // ── Sheet 1: Monthly Summary ──
      const summaryRows=[
        ['MKA ERP — VAT Report','','','',''],
        ['Year: '+year,'','Generated: '+new Date().toLocaleDateString('en-GB'),'',''],
        ['VAT Rate: 5%','','','',''],
        [],
        ['Month','Invoices','Subtotal (OMR)','VAT 5% (OMR)','Gross Total (OMR)'],
        ...byMonth.map(m=>[
          m.month,
          m.count,
          parseFloat(m.subtotal.toFixed(3)),
          parseFloat(m.vat.toFixed(3)),
          parseFloat(m.grossTotal.toFixed(3))
        ]),
        [],
        ['TOTAL ('+year+')',
          totals.count,
          parseFloat(totals.subtotal.toFixed(3)),
          parseFloat(totals.vat.toFixed(3)),
          parseFloat(totals.grossTotal.toFixed(3))
        ]
      ];
      const ws1=XLSX.utils.aoa_to_sheet(summaryRows);
      // Column widths
      ws1['!cols']=[{wch:14},{wch:10},{wch:18},{wch:16},{wch:18}];
      // Bold header rows
      const boldCells=['A1','A4','A5','B5','C5','D5','E5'];
      boldCells.forEach(addr=>{
        if(ws1[addr])ws1[addr].s={font:{bold:true}};
      });
      XLSX.utils.book_append_sheet(wb,ws1,'Monthly Summary');

      // ── Sheet 2: Invoice Detail ──
      const detailRows=[
        ['Invoice Ref','Date','Customer','LPO No','LPO Date','Subtotal (OMR)','VAT 5% (OMR)','Gross Total (OMR)','Employee'],
        ...invoices
          .filter(inv=>{
            if(!inv.created)return false;
            return new Date(inv.created).getFullYear()===year;
          })
          .sort((a,b)=>new Date(a.created)-new Date(b.created))
          .map(inv=>{
            const gross=Number(inv.total||0);
            const sub=gross/1.05;
            const vat=gross-sub;
            return[
              inv.id,
              inv.created,
              inv.customerName,
              inv.lpoNo||'',
              inv.lpoDate||'',
              parseFloat(sub.toFixed(3)),
              parseFloat(vat.toFixed(3)),
              parseFloat(gross.toFixed(3)),
              inv.employeeName||''
            ];
          })
      ];
      const ws2=XLSX.utils.aoa_to_sheet(detailRows);
      ws2['!cols']=[{wch:18},{wch:12},{wch:22},{wch:14},{wch:12},{wch:16},{wch:14},{wch:18},{wch:16}];
      XLSX.utils.book_append_sheet(wb,ws2,'Invoice Detail');

      XLSX.writeFile(wb,'MKA_VAT_Report_'+year+'.xlsx');
      logAction(user,'invoice',user.name+' exported VAT report for '+year,{year,total_vat:totals.vat.toFixed(3)});
    }catch(e){
      console.error('Export failed:',e);
      alert('Export failed: '+e.message);
    }
    setExporting(false);
  };

  const fmt=n=>'OMR '+n.toFixed(3);
  const fmtN=n=>n.toLocaleString('en-US',{minimumFractionDigits:3,maximumFractionDigits:3});

  return R('div',null,

    // ── Controls bar
    R('div',{style:{display:'flex',gap:12,alignItems:'center',marginBottom:16,flexWrap:'wrap'}},
      R('div',{style:{display:'flex',alignItems:'center',gap:8}},
        R('label',{style:{fontSize:12,color:'var(--text2)',fontWeight:600}},'Year'),
        R('select',{
          value:year,onChange:e=>setYear(Number(e.target.value)),
          style:{fontSize:13,padding:'6px 12px',minWidth:100}
        },
          years.map(y=>R('option',{key:y,value:y},y))
        )
      ),
      R('button',{
        className:'btn btn-primary',
        onClick:exportExcel,
        disabled:exporting,
        style:{marginLeft:'auto'}
      },exporting?'\u22ef Exporting\u2026':'\u2913 Export to Excel')
    ),

    // ── Info box — above metrics for visibility
    R('div',{style:{background:'var(--amber-bg)',border:'1px solid rgba(212,160,48,.2)',borderRadius:12,padding:'12px 16px',fontSize:12,color:'var(--amber)',marginBottom:16,lineHeight:1.7}},
      R('div',null,
        R('b',null,'\u2139 How VAT is calculated: '),
        'Each invoice total already includes 5% VAT, so the subtotal and VAT amount are automatically worked back from the gross.'
      ),
      R('div',{style:{marginTop:4}},
        R('b',null,'\ud83d\udcca What counts: '),
        'All approved invoices are included in this report.'
      )
    ),

    // ── Summary metrics
    R('div',{className:'grid-3',style:{marginBottom:20}},
      [
        {label:'Total Invoices ('+year+')',val:totals.count,color:'var(--text)'},
        {label:'Total VAT Collected',val:'OMR '+fmtN(totals.vat),color:'var(--green)'},
        {label:'Gross Revenue',val:'OMR '+fmtN(totals.grossTotal),color:'var(--text)'},
      ].map(m=>R('div',{key:m.label,className:'metric'},
        R('div',{className:'metric-label'},m.label),
        R('div',{className:'metric-value',style:{color:m.color,fontSize:m.val.length>10?16:undefined}},m.val)
      ))
    ),

    // ── Monthly table
    R('div',{className:'card'},
      R('div',{className:'card-title',style:{marginBottom:16}},'Monthly VAT Breakdown \u2014 '+year),
      R('div',{className:'tbl-scroll'},
        R('table',null,
          R('thead',null,R('tr',null,
            R('th',null,'Month'),
            R('th',{style:{textAlign:'center'}},'Invoices'),
            R('th',{style:{textAlign:'right'}},'Subtotal'),
            R('th',{style:{textAlign:'right'}},'VAT 5%'),
            R('th',{style:{textAlign:'right'}},'Gross Total')
          )),
          R('tbody',null,
            byMonth.map(m=>R('tr',{key:m.month,
              style:{opacity:m.count===0?0.4:1}
            },
              R('td',{style:{fontWeight:m.count>0?600:400}},m.month),
              R('td',{style:{textAlign:'center',color:'var(--text2)'}},m.count||'\u2014'),
              R('td',{style:{textAlign:'right',fontFamily:"'JetBrains Mono',monospace",fontSize:12}},
                m.count>0?fmtN(m.subtotal):'\u2014'),
              R('td',{style:{textAlign:'right',fontFamily:"'JetBrains Mono',monospace",fontSize:12,color:'var(--green)',fontWeight:600}},
                m.count>0?fmtN(m.vat):'\u2014'),
              R('td',{style:{textAlign:'right',fontFamily:"'JetBrains Mono',monospace",fontSize:12}},
                m.count>0?fmtN(m.grossTotal):'\u2014')
            )),
            R('tr',{style:{borderTop:'2px solid var(--border)',fontWeight:700,background:'var(--bg3)'}},
              R('td',null,'Total'),
              R('td',{style:{textAlign:'center'}},totals.count),
              R('td',{style:{textAlign:'right',fontFamily:"'JetBrains Mono',monospace"}},fmtN(totals.subtotal)),
              R('td',{style:{textAlign:'right',fontFamily:"'JetBrains Mono',monospace",color:'var(--green)'}},fmtN(totals.vat)),
              R('td',{style:{textAlign:'right',fontFamily:"'JetBrains Mono',monospace"}},fmtN(totals.grossTotal))
            )
          )
        )
      )
    )
  );
}

/* ── PRODUCT LIMITS PAGE ──────────────────────────────────────
   Accessible to: owner & admin roles only.
   Lets them set a per-product reorder threshold. When stock
   falls to or below that number after an invoice is generated,
   an alert fires. Items are highlighted here when breached.
   ──────────────────────────────────────────────────────────── */
function ProductLimitsPage({user,data,setData,notify}){
  const R=React.createElement;
  const products=data.products||[];
  const BASE='https://mkaerp-production.up.railway.app';

  const [edits,setEdits]=useState({});
  const [saving,setSaving]=useState({});
  const [search,setSearch]=useState('');
  const [filter,setFilter]=useState('all');

  const setEdit=(id,val)=>setEdits(e=>({...e,[id]:val}));

  const saveThreshold=async(p)=>{
    const val=parseInt(edits[p.id]);
    if(isNaN(val)||val<0){notify('Enter a valid number (0 or above)','error');return;}
    setSaving(s=>({...s,[p.id]:true}));
    try{
      const res=await fetch(`${BASE}/products/${p.id}/threshold`,{
        method:'PATCH',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({reorder_threshold:val})
      });
      if(!res.ok)throw new Error(await res.text());
      setData(d=>({...d,products:d.products.map(pr=>pr.id===p.id?{...pr,reorderThreshold:val}:pr)}));
      setEdits(e=>{const n={...e};delete n[p.id];return n;});
      logAction(user,'product',user.name+' set reorder threshold for '+p.name+' to '+val,{product:p.name,threshold:val});
      notify(p.name+' threshold saved \u2014 alert fires at \u2264'+val,'success');
    }catch(e){
      notify('Save failed: '+e.message,'error');
    }
    setSaving(s=>({...s,[p.id]:false}));
  };

  const filtered=products.filter(p=>{
    const matchSearch=!search||p.name.toLowerCase().includes(search.toLowerCase())||(p.category||'').toLowerCase().includes(search.toLowerCase());
    const thresh=Number(p.reorderThreshold??10);
    const breached=p.stock<=thresh;
    if(filter==='breached'&&!breached)return false;
    if(filter==='ok'&&breached)return false;
    return matchSearch;
  });

  const breachedCount=products.filter(p=>p.stock<=Number(p.reorderThreshold??10)).length;
  const noThresholdCount=products.filter(p=>p.reorderThreshold===undefined||p.reorderThreshold===null).length;

  return R('div',null,

    R('div',{className:'grid-3',style:{marginBottom:20}},
      [
        {label:'Total Products',val:products.length,color:'var(--text)'},
        {label:'Below Threshold',val:breachedCount,color:breachedCount>0?'var(--red)':'var(--green)'},
        {label:'No Threshold Set',val:noThresholdCount,color:noThresholdCount>0?'var(--amber)':'var(--green)'},
      ].map(m=>R('div',{key:m.label,className:'metric'},
        R('div',{className:'metric-label'},m.label),
        R('div',{className:'metric-value',style:{color:m.color}},m.val)
      ))
    ),

    R('div',{style:{background:'var(--amber-bg)',border:'1px solid rgba(212,160,48,.2)',borderRadius:12,padding:'12px 16px',fontSize:12,color:'var(--amber)',marginBottom:18,lineHeight:1.6}},
      R('b',null,'\u26a0 How thresholds work: '),
      "When an invoice is generated and a product's remaining stock falls to or below its threshold, an alert fires in-app. Default is 10 if none is set. Set to 0 to only alert on out-of-stock."
    ),

    R('div',{className:'card'},
      R('div',{style:{display:'flex',gap:10,alignItems:'center',marginBottom:16,flexWrap:'wrap'}},
        R('input',{
          placeholder:'\ud83d\udd0d Search products\u2026',
          value:search,onChange:e=>setSearch(e.target.value),
          style:{flex:'1 1 180px',maxWidth:280,fontSize:12}
        }),
        R('select',{value:filter,onChange:e=>setFilter(e.target.value),style:{fontSize:12,padding:'6px 10px',width:200}},
          R('option',{value:'all'},'All Products'),
          R('option',{value:'breached'},'\u26a0 Below Threshold'),
          R('option',{value:'ok'},'\u2713 Above Threshold')
        )
      ),

      R('div',{className:'tbl-scroll'},
        R('table',{style:{minWidth:640}},
          R('thead',null,R('tr',null,
            R('th',null,'Product'),
            R('th',null,'Category'),
            R('th',null,'Stock'),
            R('th',null,'Threshold'),
            R('th',null,'Status'),
            R('th',null,'Set Limit')
          )),
          R('tbody',null,
            filtered.length===0
              ?R('tr',null,R('td',{colSpan:6,style:{textAlign:'center',padding:24,color:'var(--text3)'}},'No products match'))
              :filtered.map(p=>{
                const thresh=Number(p.reorderThreshold??10);
                const breached=p.stock<=thresh;
                const outOfStock=p.stock===0;
                const editVal=edits[p.id];
                const isDirty=editVal!==undefined;
                return R('tr',{key:p.id},
                  R('td',{className:'primary'},p.name),
                  R('td',null,p.category||'\u2014'),
                  R('td',null,
                    R('span',{style:{
                      fontFamily:"'JetBrains Mono',monospace",fontWeight:600,
                      color:outOfStock?'var(--red)':breached?'var(--amber)':'var(--green)'
                    }},p.stock)
                  ),
                  R('td',null,
                    R('span',{style:{fontFamily:"'JetBrains Mono',monospace",fontSize:12,color:'var(--text2)'}},
                      (p.reorderThreshold!==undefined&&p.reorderThreshold!==null)?thresh:'\u2014'
                    )
                  ),
                  R('td',null,
                    outOfStock
                      ?R('span',{className:'badge rejected'},'Out of stock')
                      :breached
                        ?R('span',{className:'badge low-stock'},'\u26a0 Below threshold')
                        :R('span',{className:'badge in-stock'},'\u2713 OK')
                  ),
                  R('td',null,
                    R('div',{style:{display:'flex',gap:6,alignItems:'center'}},
                      R('input',{
                        type:'number',min:0,
                        value:isDirty?editVal:String(thresh),
                        onChange:e=>setEdit(p.id,e.target.value),
                        style:{width:70,fontSize:12,padding:'5px 8px',textAlign:'center',
                               borderColor:isDirty?'var(--amber)':'var(--border2)'}
                      }),
                      isDirty&&R('button',{
                        className:'btn btn-amber btn-sm',
                        disabled:!!saving[p.id],
                        onClick:()=>saveThreshold(p)
                      },saving[p.id]?'\u22ef':'Save'),
                      isDirty&&R('button',{
                        className:'btn btn-ghost btn-sm',
                        onClick:()=>setEdits(e=>{const n={...e};delete n[p.id];return n;})
                      },'\u00d7')
                    )
                  )
                );
              })
          )
        )
      )
    )
  );
}

const AUDIT_CATEGORIES = ['','login','logout','invoice','approval','rejection','customer','product','expense','quotation','delivery','user','system'];

function AuditLogPage({data}) {
  const [logs, setLogs] = useState([]);
  const [loading, setLoading] = useState(true);
  const [fetchError, setFetchError] = useState(null);
  const [filterUser, setFilterUser] = useState('');
  const [filterCat, setFilterCat] = useState('');
  const [search, setSearch] = useState('');
  const [selected, setSelected] = useState(null);

  useEffect(() => {
    setLoading(true);
    setFetchError(null);
    fetch(BASE_URL + '/audit-log')
      .then(r => {
        if (!r.ok) throw new Error('Server returned ' + r.status);
        return r.json();
      })
      .then(rows => {
        setLogs(Array.isArray(rows) ? rows : []);
        setLoading(false);
      })
      .catch(err => {
        console.error('Audit log fetch error:', err);
        setFetchError(err.message || 'Failed to load audit log');
        setLoading(false);
      });
  }, []);

  const allUsers = [...new Set(logs.map(l => l.user_name).filter(Boolean))].sort();

  const filtered = logs.filter(l => {
    if(filterUser && l.user_name !== filterUser) return false;
    if(filterCat && l.category !== filterCat) return false;
    if(search) {
      const q = search.toLowerCase();
      if(!(l.action||'').toLowerCase().includes(q) &&
         !(l.user_name||'').toLowerCase().includes(q) &&
         !(l.category||'').toLowerCase().includes(q)) return false;
    }
    return true;
  });

  function downloadCSV() {
    const header = 'Time,Date,User,Category,Action\n';
    const rows = filtered.map(l =>
      [l.time_label, l.date_label, l.user_name, l.category, '"'+(l.action||'').replace(/"/g,"''")+'"'].join(',')
    ).join('\n');
    const blob = new Blob([header+rows], {type:'text/csv'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download='mka_audit_log.csv'; a.click();
    URL.revokeObjectURL(url);
  }

  const hasFilters = filterUser || (filterCat && filterCat !== 'All') || search;

  return React.createElement('div', null,

    // Toolbar
    React.createElement('div', {className:'audit-toolbar'},
      React.createElement('input', {
        placeholder:'Search actions…',
        value:search,
        onChange:e=>setSearch(e.target.value),
        style:{flex:'1 1 180px',maxWidth:260}
      }),
      React.createElement('select', {value:filterUser, onChange:e=>setFilterUser(e.target.value), style:{flex:'1 1 140px',maxWidth:190}},
        React.createElement('option',{value:''},'All Employees'),
        allUsers.map(u => React.createElement('option',{key:u,value:u},u))
      ),
      React.createElement('select', {value:filterCat, onChange:e=>setFilterCat(e.target.value), style:{flex:'1 1 130px',maxWidth:170}},
        AUDIT_CATEGORIES.map(c => React.createElement('option',{key:c||'all',value:c}, c===''?'All Categories': c.charAt(0).toUpperCase()+c.slice(1)))
      ),
      hasFilters && React.createElement('button',{className:'btn btn-ghost btn-sm',onClick:()=>{setFilterUser('');setFilterCat('');setSearch('');}}, '✕ Clear'),
      React.createElement('button',{className:'btn btn-ghost btn-sm',onClick:downloadCSV,title:'Download CSV'},'↓ Export')
    ),

    // Count
    React.createElement('div', {className:'audit-count'},
      loading ? 'Loading…' : filtered.length + ' event' + (filtered.length!==1?'s':'') + (hasFilters?' (filtered)':'')
    ),

    // Table
    React.createElement('div', {className:'card', style:{padding:0,overflow:'hidden',marginTop:10}},
      loading
        ? React.createElement('div',{className:'empty'},'Loading audit log…')
        : fetchError
          ? React.createElement('div',{className:'empty',style:{color:'var(--red)'}}, '⚠ ' + fetchError)
          : filtered.length === 0
          ? React.createElement('div',{className:'empty'},'No events found')
          : React.createElement('div', {className:'tbl-scroll'},

              // Header row
              React.createElement('div', {style:{display:'grid',gridTemplateColumns:'160px 120px 1fr auto',gap:12,padding:'8px 14px',background:'var(--bg3)',borderBottom:'1px solid var(--border)'}},
                ['Time & Date','Employee','Action','Category'].map(h =>
                  React.createElement('div',{key:h,style:{fontSize:10,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'.06em',fontWeight:500}},h)
                )
              ),

              filtered.map((log, i) =>
                React.createElement('div', {
                  key: log.id || i,
                  className: 'audit-row',
                  onClick: () => setSelected(log)
                },
                  React.createElement('div', {className:'audit-ts'},
                    React.createElement('div', null, log.time_label || '—'),
                    React.createElement('div', {style:{fontSize:10,color:'var(--text3)',marginTop:1}}, log.date_label || '—')
                  ),
                  React.createElement('div', {className:'audit-user'}, log.user_name || '—'),
                  React.createElement('div', {className:'audit-action'}, log.action || '—'),
                  React.createElement('span', {className:'audit-cat ' + (log.category||'system')}, log.category || 'system')
                )
              )
            )
    ),

    // Detail popup
    selected && React.createElement('div', {className:'audit-detail-overlay', onClick:()=>setSelected(null)},
      React.createElement('div', {className:'audit-detail-card', onClick:e=>e.stopPropagation()},
        React.createElement('div', {className:'audit-detail-header'},
          React.createElement('div', null,
            React.createElement('div', {className:'audit-detail-title'}, 'Event Detail'),
            React.createElement('span', {className:'audit-cat '+(selected.category||'system'),style:{marginTop:4,display:'inline-flex'}}, selected.category||'system')
          ),
          React.createElement('button', {className:'audit-detail-close', onClick:()=>setSelected(null)}, '×')
        ),
        React.createElement('div', {className:'audit-detail-action-box'}, selected.action || '—'),
        [
          ['Employee', selected.user_name],
          ['Time',     selected.time_label],
          ['Date',     selected.date_label],
          ['Category', (selected.category||'system').charAt(0).toUpperCase()+(selected.category||'system').slice(1)],
          ...(selected.meta ? (() => {
              try {
                const parsed = typeof selected.meta === 'string' ? JSON.parse(selected.meta) : selected.meta;
                if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) {
                  return Object.entries(parsed).map(([k,v]) => [k.charAt(0).toUpperCase()+k.slice(1), String(v)]);
                }
                return [];
              } catch(e) { return []; }
            })() : [])
        ].map(([label, val]) =>
          React.createElement('div', {key:label, className:'audit-detail-row'},
            React.createElement('span', {className:'audit-detail-label'}, label),
            React.createElement('span', {className:'audit-detail-val'}, val || '—')
          )
        )
      )
    )
  );
}

/* ─────────────────────────────────────────────
   EXPENDITURE APPROVALS PAGE
   For: Ramachandran (id:1) and Arya (id:10)
   ───────────────────────────────────────────── */
function ExpenditureApprovalsPage({user,data,setData,notify}){
  const BASE='https://mkaerp-production.up.railway.app';
  const [exps,setExps]=React.useState([]);
  const [loading,setLoading]=React.useState(true);
  const [tab,setTab]=React.useState('pending');
  const [rejectModal,setRejectModal]=React.useState(null);
  const [rejectNote,setRejectNote]=React.useState('');
  const [search,setSearch]=React.useState('');

  const fetchExps=()=>{
    setLoading(true);
    fetch(`${BASE}/expenditure`)
      .then(r=>r.json())
      .then(rows=>{
        const users=data.users||[];
        const umap={};
        users.forEach(u=>{umap[u.id]=u.name});
        setExps((rows||[]).map(e=>({...e,amount:Number(e.amount),employeeName:umap[e.user_id]||'User #'+e.user_id})));
        setLoading(false);
      })
      .catch(()=>{setLoading(false);notify('Failed to load expenditures','error')});
  };

  useEffect(()=>{fetchExps();},[]);

  const filtered=exps.filter(e=>{
    if(tab==='pending'&&e.status!=='pending')return false;
    if(tab==='approved'&&e.status!=='approved')return false;
    if(tab==='rejected'&&e.status!=='rejected')return false;
    if(search){
      const q=search.toLowerCase();
      if(!((e.employeeName||'').toLowerCase().includes(q)||(e.expense_type||'').toLowerCase().includes(q)||(e.used_for||'').toLowerCase().includes(q)||(e.description||'').toLowerCase().includes(q)))return false;
    }
    return true;
  });

  const doApprove=(id)=>{
    fetch(`${BASE}/expenditure/${id}/approve`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({approved_by:user.id})})
      .then(r=>{if(!r.ok)throw new Error();return r.json();})
      .then(()=>{
        const exp=exps.find(e=>e.id===id);
        logAction(user,'expense',user.name+' approved expense for '+(exp?exp.employeeName:'an employee')+' — '+(exp?exp.expense_type:''),{expense_id:id,employee:exp?exp.employeeName:'',type:exp?exp.expense_type:'',amount:exp?exp.amount:''});
        notify('Expenditure approved','success');fetchExps();
      })
      .catch(()=>notify('Approval failed','error'));
  };

  const doReject=()=>{
    if(!rejectNote.trim()){notify('Please enter a reason','error');return;}
    fetch(`${BASE}/expenditure/${rejectModal}/reject`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({reason:rejectNote,approved_by:user.id})})
      .then(r=>{if(!r.ok)throw new Error();return r.json();})
      .then(()=>{
        const exp=exps.find(e=>e.id===rejectModal);
        logAction(user,'expense',user.name+' rejected expense for '+(exp?exp.employeeName:'an employee')+' — Reason: '+rejectNote,{expense_id:rejectModal,employee:exp?exp.employeeName:'',reason:rejectNote});
        notify('Expenditure rejected','success');setRejectModal(null);setRejectNote('');fetchExps();
      })
      .catch(()=>notify('Rejection failed','error'));
  };

  const totals={
    pending:exps.filter(e=>e.status==='pending').reduce((s,e)=>s+e.amount,0),
    approved:exps.filter(e=>e.status==='approved').reduce((s,e)=>s+e.amount,0),
    all:exps.reduce((s,e)=>s+e.amount,0),
    count:exps.filter(e=>e.status==='pending').length,
  };

  return React.createElement('div',null,
    // Stats
    React.createElement('div',{className:'exp-stat-grid'},
      [{label:'Pending Requests',val:totals.count,color:'var(--amber)'},
       {label:'Pending Amount',val:'OMR '+totals.pending.toFixed(2),color:'var(--amber)'},
       {label:'Approved Total',val:'OMR '+totals.approved.toFixed(2),color:'var(--green)'},
       {label:'All Expenditures',val:'OMR '+totals.all.toFixed(2),color:'var(--text)'},
      ].map((s,i)=>React.createElement('div',{key:i,className:'exp-stat'},
        React.createElement('div',{className:'exp-stat-label'},s.label),
        React.createElement('div',{className:'exp-stat-value',style:{color:s.color}},s.val)
      ))
    ),

    // Tabs + Search
    React.createElement('div',{style:{display:'flex',gap:10,flexWrap:'wrap',alignItems:'center',marginBottom:16}},
      React.createElement('div',{className:'exp-tabs',style:{marginBottom:0}},
        ['pending','approved','rejected','all'].map(t=>React.createElement('button',{
          key:t,className:`exp-tab${tab===t?' active':''}`,onClick:()=>setTab(t)
        },t.charAt(0).toUpperCase()+t.slice(1),t==='pending'&&totals.count>0?React.createElement('span',{style:{marginLeft:6,background:'var(--amber)',color:'#fff',borderRadius:20,padding:'1px 6px',fontSize:10}},totals.count):null))
      ),
      React.createElement('input',{
        style:{flex:1,minWidth:160,maxWidth:280},
        placeholder:'Search employee, type, purpose…',
        value:search,onChange:e=>setSearch(e.target.value)
      })
    ),

    // Table
    React.createElement('div',{className:'card'},
      loading?React.createElement('div',{className:'empty'},'Loading…'):
      filtered.length===0?React.createElement('div',{className:'empty'},'No expenditures found'):
      React.createElement('div',{className:'tbl-scroll'},
        React.createElement('table',{style:{minWidth:640}},
          React.createElement('thead',null,React.createElement('tr',null,
            ['Date','Employee','Type','Purpose','Amount','Proof','Status','Actions'].map(h=>React.createElement('th',{key:h},h))
          )),
          React.createElement('tbody',null,filtered.map(e=>React.createElement('tr',{key:e.id},
            React.createElement('td',null,(e.created_at||'').split('T')[0]),
            React.createElement('td',{className:'primary'},e.employeeName),
            React.createElement('td',null,React.createElement('span',{className:'exp-category-tag'},e.expense_type)),
            React.createElement('td',null,e.used_for||e.description||'—'),
            React.createElement('td',{style:{fontFamily:"'JetBrains Mono',monospace",fontWeight:600}},'OMR '+Number(e.amount).toFixed(2)),
            React.createElement('td',null,e.proof_url?React.createElement('a',{href:e.proof_url,target:'_blank',style:{color:'var(--green)',fontSize:11}},'View ↗'):'—'),
            React.createElement('td',null,React.createElement('span',{className:`badge ${e.status}`},e.status)),
            React.createElement('td',null,
              e.status==='pending'?React.createElement('div',{className:'exp-action-row'},
                React.createElement('button',{className:'approve-btn',onClick:()=>doApprove(e.id)},'✓ Approve'),
                React.createElement('button',{className:'reject-btn',onClick:()=>{setRejectModal(e.id);setRejectNote('')}},'✕ Reject')
              ):React.createElement('span',{style:{fontSize:10,color:'var(--text3)'}},e.approved_by?'By #'+e.approved_by:'—')
            )
          )))
        )
      )
    ),

    // Reject Modal
    rejectModal&&React.createElement('div',{className:'modal-overlay'},
      React.createElement('div',{className:'modal'},
        React.createElement('div',{className:'modal-title'},'Reject Expenditure'),
        React.createElement('div',{className:'form-group',style:{marginBottom:14}},
          React.createElement('label',null,'Reason for rejection'),
          React.createElement('textarea',{rows:3,value:rejectNote,onChange:e=>setRejectNote(e.target.value),placeholder:'Enter reason…',style:{resize:'vertical'}})
        ),
        React.createElement('div',{className:'modal-actions'},
          React.createElement('button',{className:'btn btn-ghost',onClick:()=>setRejectModal(null)},'Cancel'),
          React.createElement('button',{className:'btn btn-danger',onClick:doReject},'Reject')
        )
      )
    )
  );
}

/* ─────────────────────────────────────────────
   EXPENDITURE TRACKER PAGE
   For: accountant + Arya (id:10)
   ───────────────────────────────────────────── */
function ExpenditureTrackerPage({user,data,setData,notify}){
  const BASE='https://mkaerp-production.up.railway.app';
  const [exps,setExps]=React.useState([]);
  const [loading,setLoading]=React.useState(true);
  const [showForm,setShowForm]=React.useState(false);
  const [editExp,setEditExp]=React.useState(null);
  const [filterEmployee,setFilterEmployee]=React.useState('');
  const [filterType,setFilterType]=React.useState('');
  const [filterStatus,setFilterStatus]=React.useState('');
  const [filterPlate,setFilterPlate]=React.useState('');
  const [search,setSearch]=React.useState('');

  const EXPENSE_TYPES=['Petty Cash','Fuel','Maintenance','Office Supplies','Vehicle Repair','Toll/Parking','Utilities','Other'];

  const emptyForm={user_id:'',amount:'',expense_type:'',description:'',used_for:'',proof_url:'',car_plate:'',category:'',is_petty_cash:false};
  const [form,setForm]=React.useState(emptyForm);

  const fetchExps=()=>{
    setLoading(true);
    fetch(`${BASE}/expenditure`)
      .then(r=>r.json())
      .then(rows=>{
        const users=data.users||[];
        const umap={};
        users.forEach(u=>{umap[u.id]=u.name});
        setExps((rows||[]).map(e=>({...e,amount:Number(e.amount),employeeName:umap[e.user_id]||'User #'+e.user_id})));
        setLoading(false);
      })
      .catch(()=>{setLoading(false);notify('Failed to load expenditures','error')});
  };

  useEffect(()=>{fetchExps();},[]);

  const setF=(k,v)=>setForm(f=>({...f,[k]:v}));

  const openAdd=()=>{setForm(emptyForm);setEditExp(null);setShowForm(true)};
  const openEdit=(e)=>{
    setForm({user_id:e.user_id,amount:e.amount,expense_type:e.expense_type,description:e.description||'',used_for:e.used_for||'',proof_url:e.proof_url||'',car_plate:e.car_plate||'',category:e.category||'',is_petty_cash:!!e.is_petty_cash});
    setEditExp(e);setShowForm(true);
  };

  const handleSave=()=>{
    if(!form.user_id||!form.amount||!form.expense_type){notify('Fill required fields','error');return;}
    const body={...form,amount:Number(form.amount),user_id:Number(form.user_id)};
    const url=editExp?`${BASE}/expenditure/${editExp.id}`:`${BASE}/expenditure`;
    const method=editExp?'PUT':'POST';
    fetch(url,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
      .then(r=>{if(!r.ok)throw new Error();return r.json();})
      .then(()=>{notify(editExp?'Expenditure updated':'Expenditure added','success');setShowForm(false);fetchExps();})
      .catch(()=>notify('Save failed','error'));
  };

  const handleDelete=(id)=>{
    if(!window.confirm('Delete this expenditure?'))return;
    fetch(`${BASE}/expenditure/${id}`,{method:'DELETE'})
      .then(r=>{if(!r.ok)throw new Error();return r.json();})
      .then(()=>{notify('Deleted','success');fetchExps();})
      .catch(()=>notify('Delete failed','error'));
  };

  // Unique car plates from existing records
  const allPlates=[...new Set(exps.map(e=>e.car_plate).filter(Boolean))];
  const allEmployees=data.users||[];

  const filtered=exps.filter(e=>{
    if(filterEmployee&&String(e.user_id)!==filterEmployee)return false;
    if(filterType&&e.expense_type!==filterType)return false;
    if(filterStatus&&e.status!==filterStatus)return false;
    if(filterPlate&&(e.car_plate||'').toLowerCase()!==filterPlate.toLowerCase())return false;
    if(search){
      const q=search.toLowerCase();
      if(!((e.employeeName||'').toLowerCase().includes(q)||(e.expense_type||'').toLowerCase().includes(q)||(e.used_for||'').toLowerCase().includes(q)||(e.car_plate||'').toLowerCase().includes(q)||(e.description||'').toLowerCase().includes(q)))return false;
    }
    return true;
  });

  const totals={
    total:filtered.reduce((s,e)=>s+e.amount,0),
    petty:filtered.filter(e=>e.is_petty_cash||e.expense_type==='Petty Cash').reduce((s,e)=>s+e.amount,0),
    pending:filtered.filter(e=>e.status==='pending').length,
    approved:filtered.filter(e=>e.status==='approved').reduce((s,e)=>s+e.amount,0),
  };

  const hasFilters=filterEmployee||filterType||filterStatus||filterPlate||search;

  return React.createElement('div',null,

    // Header row
    React.createElement('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:18,flexWrap:'wrap',gap:10}},
      React.createElement('div',{style:{fontSize:13,color:'var(--text2)'}},`Showing ${filtered.length} of ${exps.length} records`),
      React.createElement('button',{className:'btn btn-primary',onClick:openAdd},'+ Add Expenditure')
    ),

    // Stats
    React.createElement('div',{className:'exp-stat-grid',style:{marginBottom:18}},
      [{label:'Total (Filtered)',val:'OMR '+totals.total.toFixed(2),color:'var(--text)'},
       {label:'Petty Cash',val:'OMR '+totals.petty.toFixed(2),color:'var(--amber)'},
       {label:'Approved Value',val:'OMR '+totals.approved.toFixed(2),color:'var(--green)'},
       {label:'Pending Approvals',val:totals.pending,color:'var(--amber)'},
      ].map((s,i)=>React.createElement('div',{key:i,className:'exp-stat'},
        React.createElement('div',{className:'exp-stat-label'},s.label),
        React.createElement('div',{className:'exp-stat-value',style:{color:s.color}},s.val)
      ))
    ),

    // Filters
    React.createElement('div',{className:'card',style:{marginBottom:16,padding:'14px 16px'}},
      React.createElement('div',{style:{fontSize:11,fontWeight:600,color:'var(--text3)',marginBottom:10,textTransform:'uppercase',letterSpacing:'.06em'}},'Filters'),
      React.createElement('div',{className:'exp-filter-bar'},
        React.createElement('input',{placeholder:'Search…',value:search,onChange:e=>setSearch(e.target.value),style:{flex:'1 1 140px',maxWidth:220}}),
        React.createElement('select',{value:filterEmployee,onChange:e=>setFilterEmployee(e.target.value),style:{flex:'1 1 130px',maxWidth:180}},
          React.createElement('option',{value:''},'All Employees'),
          allEmployees.map(u=>React.createElement('option',{key:u.id,value:String(u.id)},u.name))
        ),
        React.createElement('select',{value:filterType,onChange:e=>setFilterType(e.target.value),style:{flex:'1 1 130px',maxWidth:180}},
          React.createElement('option',{value:''},'All Types'),
          EXPENSE_TYPES.map(t=>React.createElement('option',{key:t,value:t},t))
        ),
        React.createElement('select',{value:filterPlate,onChange:e=>setFilterPlate(e.target.value),style:{flex:'1 1 130px',maxWidth:180}},
          React.createElement('option',{value:''},'All Plates'),
          allPlates.map(p=>React.createElement('option',{key:p,value:p},p))
        ),
        React.createElement('select',{value:filterStatus,onChange:e=>setFilterStatus(e.target.value),style:{flex:'1 1 110px',maxWidth:150}},
          React.createElement('option',{value:''},'All Status'),
          ['pending','approved','rejected'].map(s=>React.createElement('option',{key:s,value:s},s.charAt(0).toUpperCase()+s.slice(1)))
        ),
        hasFilters&&React.createElement('button',{className:'btn btn-ghost btn-sm',onClick:()=>{setFilterEmployee('');setFilterType('');setFilterStatus('');setFilterPlate('');setSearch('')}},'✕ Clear')
      )
    ),

    // Table
    React.createElement('div',{className:'card'},
      loading?React.createElement('div',{className:'empty'},'Loading…'):
      filtered.length===0?React.createElement('div',{className:'empty'},'No records match filters'):
      React.createElement('div',{className:'tbl-scroll'},
        React.createElement('table',{style:{minWidth:760}},
          React.createElement('thead',null,React.createElement('tr',null,
            ['Date','Employee','Type','Purpose','Car Plate','Amount','Petty Cash','Proof','Status','Actions'].map(h=>React.createElement('th',{key:h},h))
          )),
          React.createElement('tbody',null,filtered.map(e=>React.createElement('tr',{key:e.id},
            React.createElement('td',null,(e.created_at||'').split('T')[0]),
            React.createElement('td',{className:'primary'},e.employeeName),
            React.createElement('td',null,React.createElement('span',{className:'exp-category-tag'},e.expense_type)),
            React.createElement('td',null,e.used_for||e.description||'—'),
            React.createElement('td',{style:{fontFamily:"'JetBrains Mono',monospace",fontSize:11}},e.car_plate||'—'),
            React.createElement('td',{style:{fontFamily:"'JetBrains Mono',monospace",fontWeight:600}},'OMR '+Number(e.amount).toFixed(2)),
            React.createElement('td',null,(e.is_petty_cash||e.expense_type==='Petty Cash')?React.createElement('span',{className:'badge pending'},'Yes'):React.createElement('span',{style:{color:'var(--text3)',fontSize:11}},'No')),
            React.createElement('td',null,e.proof_url?React.createElement('a',{href:e.proof_url,target:'_blank',style:{color:'var(--green)',fontSize:11}},'View ↗'):'—'),
            React.createElement('td',null,React.createElement('span',{className:`badge ${e.status}`},e.status)),
            React.createElement('td',null,React.createElement('div',{className:'exp-action-row'},
              React.createElement('button',{className:'btn btn-ghost btn-sm',onClick:()=>openEdit(e)},'Edit'),
              React.createElement('button',{className:'btn btn-danger btn-sm',onClick:()=>handleDelete(e.id)},'Del')
            ))
          )))
        )
      )
    ),

    // Add/Edit Modal
    showForm&&React.createElement('div',{className:'modal-overlay'},
      React.createElement('div',{className:'modal'},
        React.createElement('div',{className:'modal-title'},editExp?'Edit Expenditure':'Add Expenditure'),
        React.createElement('div',{className:'form-grid'},
          React.createElement('div',{className:'form-row'},
            React.createElement('div',{className:'form-group'},
              React.createElement('label',null,'Employee *'),
              React.createElement('select',{value:form.user_id,onChange:e=>setF('user_id',e.target.value)},
                React.createElement('option',{value:''},'Select…'),
                (data.users||[]).map(u=>React.createElement('option',{key:u.id,value:u.id},u.name))
              )
            ),
            React.createElement('div',{className:'form-group'},
              React.createElement('label',null,'Amount (OMR) *'),
              React.createElement('input',{type:'number',step:'0.01',min:0,value:form.amount,onChange:e=>setF('amount',e.target.value),placeholder:'0.000'})
            )
          ),
          React.createElement('div',{className:'form-row'},
            React.createElement('div',{className:'form-group'},
              React.createElement('label',null,'Expense Type *'),
              React.createElement('select',{value:form.expense_type,onChange:e=>setF('expense_type',e.target.value)},
                React.createElement('option',{value:''},'Select type…'),
                EXPENSE_TYPES.map(t=>React.createElement('option',{key:t,value:t},t))
              )
            ),
            React.createElement('div',{className:'form-group'},
              React.createElement('label',null,'Car Plate No.'),
              React.createElement('input',{value:form.car_plate,onChange:e=>setF('car_plate',e.target.value),placeholder:'e.g. 12345 A'})
            )
          ),
          React.createElement('div',{className:'form-group'},
            React.createElement('label',null,'Used For / Purpose'),
            React.createElement('input',{value:form.used_for,onChange:e=>setF('used_for',e.target.value),placeholder:'e.g. Client delivery, Office run…'})
          ),
          React.createElement('div',{className:'form-group'},
            React.createElement('label',null,'Description / Notes'),
            React.createElement('textarea',{rows:2,value:form.description,onChange:e=>setF('description',e.target.value),placeholder:'Additional details…',style:{resize:'vertical'}})
          ),
          React.createElement('div',{className:'form-group'},
            React.createElement('label',null,'Proof URL (receipt image link) / Accountant in-charge Name'),
            React.createElement('input',{value:form.proof_url,onChange:e=>setF('proof_url',e.target.value),placeholder:'https://…'})
          ),
          React.createElement('div',{style:{display:'flex',alignItems:'center',gap:10,padding:'4px 0'}},
            React.createElement('input',{type:'checkbox',id:'is_petty_cash',checked:!!form.is_petty_cash,onChange:e=>setF('is_petty_cash',e.target.checked),style:{width:'auto',marginRight:4}}),
            React.createElement('label',{htmlFor:'is_petty_cash',style:{marginBottom:0,cursor:'pointer'}},'Mark as Petty Cash')
          )
        ),
        React.createElement('div',{className:'modal-actions'},
          React.createElement('button',{className:'btn btn-ghost',onClick:()=>setShowForm(false)},'Cancel'),
          React.createElement('button',{className:'btn btn-primary',onClick:handleSave},editExp?'Save Changes':'Add Expenditure')
        )
      )
    )
  );
}

ReactDOM.render(React.createElement(App),document.getElementById('root'));
</script>
