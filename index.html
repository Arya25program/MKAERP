<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="./logo.png">
<title>MKA ERP</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Sora',sans-serif;font-size:14px;line-height:1.6;height:100vh;transition:background .2s,color .2s}
#root{height:100%;overflow:hidden;display:flex;flex-direction:column}
body.dark{--bg:#1a1a1a;--bg2:#222;--bg3:#2a2a2a;--bg4:#303030;--border:#333;--border2:#444;--text:#f0f0ee;--text2:#a0a09a;--text3:#666660;--green:#3dba78;--green-bg:#1e2e24;--amber:#d4a030;--amber-bg:#2e2618;--red:#d45c5c;--red-bg:#2e1e1e;--shadow:rgba(0,0,0,.3);--nav-bg:rgba(30,30,30,.88)}
body.light{--bg:#f4f4f0;--bg2:#ffffff;--bg3:#ededea;--bg4:#e4e4e0;--border:#d8d8d4;--border2:#c8c8c4;--text:#1a1a18;--text2:#5a5a56;--text3:#9a9a96;--green:#1f9a5e;--green-bg:#e8f7ef;--amber:#b07800;--amber-bg:#fef8e0;--red:#c04040;--red-bg:#fdf0f0;--shadow:rgba(0,0,0,.08);--nav-bg:rgba(255,255,255,.88)}
body.easter{--bg:#0C243D;--bg2:#27496A;--bg3:#1e3a56;--bg4:#2d5276;--border:#3a6080;--border2:#4a7090;--text:#C1D1DB;--text2:#9AB7CD;--text3:#5C8EB4;--green:#5CBBA0;--green-bg:#0e2a30;--amber:#d4a030;--amber-bg:#2e2618;--red:#e07070;--red-bg:#2e1e1e;--shadow:rgba(0,0,0,.5);--nav-bg:rgba(12,36,61,.92)}
body.easter .toggle-track{background:#3a6080}
body.easter .toggle-track.on{background:#5C8EB4}
body.easter .btn-primary{background:#C1D1DB;color:#0C243D}
body.easter .nav-item.active{border-left-color:#9AB7CD;background:#1e3a56;color:#C1D1DB}
body.easter .topbar-date{cursor:pointer;user-select:none}
body.easter .topbar-date:hover{opacity:.75}
body{background:var(--bg);color:var(--text)}
input,select,textarea{background:var(--bg3);border:1px solid var(--border2);color:var(--text);border-radius:10px;padding:9px 13px;width:100%;font-family:inherit;font-size:13px;outline:none;transition:border .2s,background .2s}
input:focus,select:focus,textarea:focus{border-color:var(--text3)}
button{cursor:pointer;font-family:inherit;border:none;border-radius:10px;font-size:13px;font-weight:500;transition:all .15s}
label{font-size:12px;color:var(--text2);display:block;margin-bottom:4px}
select option{background:var(--bg3);color:var(--text)}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:210px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:18px 0;flex-shrink:0;transition:background .2s}
.sidebar-logo{padding:0 18px 20px;border-bottom:1px solid var(--border)}
.logo-text{font-size:14px;font-weight:600;color:var(--text)}
.logo-sub{font-size:10px;color:var(--text3);font-family:'JetBrains Mono',monospace}
.nav{flex:1;padding:14px 0;overflow-y:auto}
.nav-section{font-size:10px;color:var(--text3);padding:10px 18px 5px;letter-spacing:.08em;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 18px;cursor:pointer;color:var(--text2);font-size:13px;transition:all .15s;border-left:2px solid transparent}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:var(--bg3);color:var(--text);border-left-color:var(--text);font-weight:500}
.sidebar-bottom{padding:10px 18px 14px;border-top:1px solid var(--border)}
.theme-toggle{display:flex;align-items:center;justify-content:space-between;padding:8px 0;margin-bottom:10px}
.theme-label{font-size:11px;color:var(--text3)}
.toggle-track{width:32px;height:18px;background:var(--bg4);border-radius:20px;position:relative;cursor:pointer;border:1px solid var(--border2);transition:background .2s}
.toggle-track.on{background:var(--text3)}
.toggle-thumb{width:12px;height:12px;border-radius:50%;background:var(--text);position:absolute;top:2px;left:2px;transition:left .2s}
.toggle-track.on .toggle-thumb{left:16px}
.user-chip{display:flex;align-items:center;gap:9px}
.avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;flex-shrink:0;background:var(--bg4);color:var(--text);border:1px solid var(--border2)}
.user-name{font-size:12px;font-weight:500;color:var(--text)}
.user-role{font-size:10px;color:var(--text3)}
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:13px 26px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.page-title{font-size:15px;font-weight:600;color:var(--text)}
.page-sub{font-size:11px;color:var(--text3);margin-top:1px}
.content{padding:22px 26px;flex:1}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:18px;transition:background .2s}
.card-title{font-size:13px;font-weight:600;margin-bottom:14px;color:var(--text)}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.metric{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:16px 18px}
.metric-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px}
.metric-value{font-size:22px;font-weight:600;font-family:'JetBrains Mono',monospace;line-height:1;color:var(--text)}
.metric-change{font-size:11px;margin-top:5px;color:var(--text3)}
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:500}
.badge.pending{background:var(--amber-bg);color:var(--amber)}
.badge.approved{background:var(--green-bg);color:var(--green)}
.badge.rejected{background:var(--red-bg);color:var(--red)}
.badge.new{background:var(--bg3);color:var(--text2)}
.badge.converted{background:var(--green-bg);color:var(--green)}
.badge.lost{background:var(--bg3);color:var(--text3)}
.badge.in-stock{background:var(--green-bg);color:var(--green)}
.badge.low-stock{background:var(--amber-bg);color:var(--amber)}
.badge.delivered{background:var(--green-bg);color:var(--green)}
.badge.scheduled{background:var(--amber-bg);color:var(--amber)}
.badge.unscheduled{background:var(--bg3);color:var(--text3)}
table{width:100%;border-collapse:collapse}
th{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;padding:7px 11px;text-align:left;border-bottom:1px solid var(--border)}
td{padding:10px 11px;border-bottom:1px solid var(--border);font-size:12px;color:var(--text2)}
td.primary{color:var(--text)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg3)}
.btn{padding:8px 16px;font-size:12px;font-weight:500;border-radius:10px;cursor:pointer;border:none}
.btn-primary{background:var(--text);color:var(--bg)}
.btn-primary:hover{opacity:.85}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border2)}
.btn-ghost:hover{border-color:var(--text3);color:var(--text)}
.btn-success{background:var(--green-bg);color:var(--green);border:1px solid rgba(61,186,120,.2)}
.btn-danger{background:var(--red-bg);color:var(--red);border:1px solid rgba(212,92,92,.2)}
.btn-amber{background:var(--amber-bg);color:var(--amber);border:1px solid rgba(212,160,48,.2)}
.btn-sm{padding:4px 10px;font-size:11px}
.form-grid{display:flex;flex-direction:column;gap:14px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-group{display:flex;flex-direction:column}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.login-wrap{display:flex;align-items:center;justify-content:center;height:100vh;overflow-y:auto;background:var(--bg)}
.login-card{width:360px;background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:36px}
.login-form{margin-top:24px;display:flex;flex-direction:column;gap:14px}
.demo-label{font-size:10px;color:var(--text3);margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em}
.role-btns{display:flex;gap:6px;flex-wrap:wrap}
.role-btn{padding:5px 10px;border-radius:7px;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);font-size:11px;cursor:pointer;transition:all .15s;font-family:'Sora',sans-serif}
.role-btn:hover{border-color:var(--text3);color:var(--text)}
.invoice-items{background:var(--bg3);border:1px solid var(--border2);border-radius:10px;overflow:hidden}
.item-row{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;padding:10px 14px;align-items:center;border-bottom:1px solid var(--border)}
.item-row:last-child{border-bottom:none}
.item-header{background:var(--bg4);font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em}
.empty{text-align:center;padding:40px;color:var(--text3)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;overflow-y:auto}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:16px;padding:24px 20px;width:100%;max-width:560px;max-height:85vh;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative;margin:auto}
.modal-title{font-size:14px;font-weight:600;margin-bottom:18px;color:var(--text)}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;padding-top:14px;border-top:1px solid var(--border);flex-wrap:wrap}
.modal-actions .btn{flex:1;min-width:80px;text-align:center;padding:11px 10px}
.notif{position:fixed;top:18px;right:18px;background:var(--bg2);border:1px solid var(--border2);border-radius:10px;padding:10px 14px;z-index:300;font-size:12px;display:flex;align-items:center;gap:9px;max-width:340px;box-shadow:0 4px 20px var(--shadow)}
.notif.success{border-color:var(--green)}
.notif.error{border-color:var(--red)}
.comment-box{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px;margin-top:10px}
.comment-meta{font-size:10px;color:var(--text3);margin-bottom:4px}
.comment-text{font-size:12px;color:var(--text2)}
.approval-banner{background:var(--green-bg);border:1px solid rgba(61,186,120,.25);border-radius:10px;padding:10px 14px;font-size:12px;color:var(--green)}
.rejection-banner{background:var(--red-bg);border:1px solid rgba(212,92,92,.25);border-radius:10px;padding:10px 14px;font-size:12px;color:var(--red)}
/* ── Pending Approvals Overview ── */
.pao-stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
@media(max-width:768px){.pao-stat-grid{grid-template-columns:repeat(2,1fr)}}
.pao-stat{background:var(--bg2);border:1px solid var(--border2);border-radius:12px;padding:14px 16px}
.pao-stat-val{font-size:28px;font-weight:700;font-family:'JetBrains Mono',monospace;line-height:1}
.pao-stat-label{font-size:11px;color:var(--text3);margin-top:4px;text-transform:uppercase;letter-spacing:.06em}
.pao-priority-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:600;letter-spacing:.04em}
.pao-priority-badge.critical{background:var(--red-bg);color:var(--red)}
.pao-priority-badge.high{background:var(--amber-bg);color:var(--amber)}
.pao-priority-badge.standard{background:var(--green-bg);color:var(--green)}
.pao-row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr auto;gap:8px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--border);font-size:12px;cursor:pointer;transition:background .12s}
.pao-row:hover{background:var(--bg3)}
.pao-row-head{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr auto;gap:8px;align-items:center;padding:7px 14px;font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;background:var(--bg4);border-bottom:1px solid var(--border)}
@media(max-width:600px){.pao-row,.pao-row-head{grid-template-columns:1fr 1fr auto;}.pao-col-hide{display:none}}
.pao-checkbox{width:15px;height:15px;cursor:pointer;accent-color:var(--green)}
.pao-email-bar{background:var(--bg3);border:1px solid var(--border2);border-radius:12px;padding:14px 18px;display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.pao-notif-dot{position:absolute;top:-3px;right:-3px;width:8px;height:8px;background:var(--amber);border-radius:50%;border:2px solid var(--bg)}
.nav-item-wrap{position:relative;display:flex;align-items:center;width:100%}
.nav-badge{position:absolute;right:8px;background:var(--amber);color:#000;font-size:9px;font-weight:700;padding:1px 5px;border-radius:8px;font-family:'JetBrains Mono',monospace;min-width:16px;text-align:center}
.back-btn{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text3);cursor:pointer;margin-bottom:16px;padding:6px 0}
.back-btn:hover{color:var(--text)}
.tag{display:inline-flex;padding:2px 8px;border-radius:6px;font-size:10px;background:var(--bg3);color:var(--text3);border:1px solid var(--border)}
.print-page{display:none}
@media print{
  body>*{display:none}
  .print-page{display:block!important;background:#fff;color:#111;font-family:'Sora',sans-serif;z-index:9999}
  .print-page .print-doc{box-sizing:border-box;padding:0;margin:0}
  .print-doc-break{page-break-before:always!important;break-before:page!important;display:block}
  @page{margin:0;size:A4}
}
.divider{border:none;border-top:1px solid var(--border);margin:14px 0}
/* circular progress */
.circ-wrap{position:relative;width:48px;height:48px;flex-shrink:0}
.circ-wrap svg{transform:rotate(-90deg)}
.circ-wrap .circ-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;font-family:'JetBrains Mono',monospace;color:var(--text)}
/* quot product card */
.quot-group{background:var(--bg3);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
.quot-chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg4);border:1px solid var(--border2);border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer;transition:background .15s}
.quot-chip:hover{background:var(--bg2)}
/* quot formal table */
.quot-table{width:100%;border-collapse:collapse;margin:12px 0}
.quot-table th{background:var(--bg3);font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;padding:8px 12px;text-align:left;border-bottom:1px solid var(--border)}
.quot-table td{padding:9px 12px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text2)}
.quot-table td.num{font-family:'JetBrains Mono',monospace;text-align:right}
.quot-table tr:last-child td{border-bottom:none}
.quot-total-row td{font-weight:600;color:var(--text);background:var(--bg3)}
.sect-title{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px;margin-top:20px}
/* Dev Admin AI Panel */
.dev-ai-box{background:var(--bg3);border:1px solid var(--border2);border-radius:10px;padding:8px 10px;margin-bottom:10px}
.dev-ai-label{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;display:flex;align-items:center;gap:4px}
.dev-ai-label span{width:6px;height:6px;background:var(--green);border-radius:50%;display:inline-block;animation:devpulse 2s infinite}
@keyframes devpulse{0%,100%{opacity:1}50%{opacity:.4}}
.dev-ai-row{display:flex;gap:5px;align-items:center}
.dev-ai-input{flex:1;font-size:11px;padding:5px 8px;border-radius:7px;background:var(--bg2);border:1px solid var(--border2);color:var(--text);outline:none;min-width:0}
.dev-ai-input:focus{border-color:var(--text3)}
.dev-ai-btn{padding:5px 8px;border-radius:7px;background:var(--text);color:var(--bg);font-size:11px;border:none;cursor:pointer;flex-shrink:0;font-weight:600;transition:opacity .15s}
.dev-ai-btn:hover{opacity:.8}
/* AI Chat Popup */
.dev-chat-overlay{position:fixed;inset:0;z-index:500;pointer-events:none}
.dev-chat-popup{position:fixed;bottom:20px;left:220px;width:360px;height:500px;background:var(--bg2);border:1px solid var(--border2);border-radius:14px;display:flex;flex-direction:column;z-index:501;box-shadow:0 8px 40px rgba(0,0,0,.35);pointer-events:all;overflow:hidden}
.dev-chat-header{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:var(--bg3)}
.dev-chat-title{font-size:12px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:6px}
.dev-chat-close{width:22px;height:22px;border-radius:6px;background:var(--bg4);border:1px solid var(--border2);color:var(--text2);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.dev-chat-close:hover{color:var(--text);border-color:var(--text3)}
.dev-chat-messages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.dev-chat-messages::-webkit-scrollbar{width:4px}
.dev-chat-messages::-webkit-scrollbar-track{background:transparent}
.dev-chat-messages::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
.chat-msg{max-width:88%;font-size:12px;line-height:1.5;padding:8px 11px;border-radius:10px;word-break:break-word}
.chat-msg.user{background:var(--bg4);color:var(--text);align-self:flex-end;border-bottom-right-radius:3px}
.chat-msg.ai{background:var(--bg3);color:var(--text);align-self:flex-start;border-bottom-left-radius:3px;border:1px solid var(--border)}
.chat-msg.ai.thinking{color:var(--text3);font-style:italic}
.chat-msg-meta{font-size:9px;color:var(--text3);margin-top:3px}
.dev-chat-bottom{padding:10px;border-top:1px solid var(--border);display:flex;gap:6px;flex-shrink:0;background:var(--bg2)}
.dev-chat-bottom input{flex:1;font-size:12px;padding:7px 10px;border-radius:8px;background:var(--bg3);border:1px solid var(--border2);color:var(--text);outline:none}
.dev-chat-bottom input:focus{border-color:var(--text3)}
.dev-chat-send{padding:7px 12px;border-radius:8px;background:var(--text);color:var(--bg);font-size:12px;border:none;cursor:pointer;font-weight:600;transition:opacity .15s;flex-shrink:0}
.dev-chat-send:hover{opacity:.8}
.dev-chat-send:disabled{opacity:.4;cursor:not-allowed}
.mini-grid {display: grid;grid-template-columns: repeat(4, 1fr);gap: 12px;}
.mini-card {background: #1e1e1e;border-radius: 10px;padding: 10px;min-height: 70px;display: flex;flex-direction: column;justify-content: space-between;}
.mini-title {
  font-size: 12px;
  opacity: 0.7;
}

.mini-content {
  display: flex;
  justify-content: flex-end;
  align-items: center;
}

/* Button */
.mini-btn {
  background: #333;
  border: none;
  padding: 6px 10px;
  border-radius: 6px;
  color: white;
  cursor: pointer;
}

/* Toggle */
.toggle {
  width: 36px;
  height: 18px;
  background: #444;
  border-radius: 20px;
  position: relative;
  cursor: pointer;
}

.toggle-knob {
  width: 14px;
  height: 14px;
  background: white;
  border-radius: 50%;
  position: absolute;
  top: 2px;
  left: 2px;
  transition: 0.2s;
}

/* ── MOBILE BOTTOM NAV BAR ── */
.mobile-nav{
  display:none;
  position:fixed;
  bottom:0;left:0;right:0;
  background:var(--nav-bg,rgba(26,26,26,.97));
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--border);
  z-index:250;
  padding:6px 8px 10px;
  gap:2px;
  align-items:stretch;
  justify-content:space-around;
  box-shadow:0 -4px 20px rgba(0,0,0,.25);
}
body.light .mobile-nav{background:rgba(255,255,255,.97)}
.mob-item{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:8px 6px;border-radius:12px;cursor:pointer;
  color:var(--text3);font-size:10px;font-weight:500;
  flex:1;min-width:0;max-width:80px;
  transition:all .18s;font-family:'Sora',sans-serif;
  border:none;background:transparent;
}
.mob-item.active{background:var(--bg3);color:var(--text)}
.mob-item:not(.active):hover{background:var(--bg3);color:var(--text2)}
.mob-icon{font-size:20px;line-height:1.2;display:block}
.mob-label{font-size:10px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:64px}

/* ── MOBILE PROFILE BUTTON ── */
.mob-profile-btn{
  display:none;align-items:center;gap:8px;
  background:var(--bg3);border:1px solid var(--border2);
  border-radius:20px;padding:5px 10px 5px 5px;cursor:pointer;
  transition:all .15s;
}
.mob-profile-btn:hover{border-color:var(--text3)}
.mob-theme-btn{
  display:none;align-items:center;justify-content:center;
  width:34px;height:34px;
  background:var(--bg3);border:1px solid var(--border2);
  border-radius:50%;cursor:pointer;font-size:16px;
  transition:all .15s;flex-shrink:0;
}
.mob-theme-btn:hover{border-color:var(--text3)}
.mob-profile-avatar{width:26px;height:26px;border-radius:50%;background:var(--bg4);color:var(--text);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;flex-shrink:0}
.mob-profile-name{font-size:11px;font-weight:500;color:var(--text)}

/* ── MOBILE PROFILE SHEET — stays as bottom sheet intentionally ── */
.mob-profile-sheet{
  position:fixed;inset:0;z-index:400;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.55);
  padding:20px;
}
.mob-profile-inner{
  background:var(--bg2);border:1px solid var(--border2);
  border-radius:16px;width:100%;max-width:400px;padding:24px 20px 28px;
}
.mob-profile-header{display:flex;align-items:center;gap:14px;margin-bottom:24px;padding-bottom:18px;border-bottom:1px solid var(--border)}
.mob-big-avatar{width:52px;height:52px;border-radius:50%;background:var(--bg4);color:var(--text);border:2px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700}
.mob-profile-info-name{font-size:16px;font-weight:600;color:var(--text)}
.mob-profile-info-role{font-size:12px;color:var(--text3);margin-top:2px}
.mob-profile-info-email{font-size:11px;color:var(--text3);margin-top:2px}

/* ── TABLE SCROLL ── */
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px}

/* ── USERS TABLE ACTIONS — ALWAYS VISIBLE ── */
.user-actions{display:flex;gap:5px;flex-wrap:wrap;align-items:center}

/* ── IMPORT CHOICE CARDS ── */
.import-choice{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:4px}
.import-opt{border:2px solid var(--border2);border-radius:14px;padding:22px 16px;cursor:pointer;text-align:center;transition:all .2s;background:var(--bg3)}
.import-opt:hover,.import-opt.selected{border-color:var(--text);background:var(--bg4)}
.import-opt-icon{font-size:32px;margin-bottom:10px}
.import-opt-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:4px}
.import-opt-desc{font-size:11px;color:var(--text3)}
.excel-preview-row{display:grid;gap:0;border-bottom:1px solid var(--border)}
.excel-preview-row:last-child{border-bottom:none}
.excel-cell{padding:7px 10px;font-size:11px;border-right:1px solid var(--border)}
.excel-cell:last-child{border-right:none}
.excel-hdr{background:var(--bg4);font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;font-weight:500}
.col-map-row{display:grid;grid-template-columns:130px 24px 1fr;gap:10px;align-items:center;margin-bottom:10px}
.drop-zone{border:2px dashed var(--border2);border-radius:12px;padding:32px;text-align:center;cursor:pointer;transition:all .2s;margin:8px 0}
.drop-zone:hover,.drop-zone.dz-over{border-color:var(--text3);background:var(--bg3)}
.drop-zone-icon{font-size:34px;margin-bottom:10px}

/* ── RESPONSIVE ── */
@media(max-width:768px){
  .sidebar{display:none!important}
  .mobile-nav{display:flex!important}
  .mob-profile-btn{display:flex!important}
  .mob-theme-btn{display:flex!important}
  .app{height:100vh;overflow:hidden}
  .main{flex:1;overflow-y:auto}
  .content{padding:14px 14px 90px!important}
  .topbar{padding:10px 14px!important}

  .login-wrap{padding:16px!important;align-items:flex-start!important;padding-top:36px!important;overflow-y:auto!important}
  .login-card{width:100%!important;max-width:440px!important;padding:22px!important}
  /* MODALS: always centered on mobile too */

  .modal-actions{justify-content:stretch!important}
  .modal-actions .btn{flex:1!important;text-align:center!important;padding:12px!important;font-size:13px!important}
  .notif{top:10px!important;right:10px!important;left:10px!important;max-width:none!important}
  .dev-chat-popup{left:10px!important;right:10px!important;bottom:80px!important;width:auto!important}

.doc {
  max-width: 100%;
  margin: auto;
  font-family: 'Sora', sans-serif;
  color: #111;
  position: relative;
  display: flex;
  flex-direction: column;
  min-height: 1025px; /* A4 at 96dpi (794px) minus padding (32px top + 32px bottom) × scale = ~1025px content height */
  box-sizing: border-box;
}

.doc-content {
  flex: 1; /* pushes footer to the bottom */
}

.footer-img-box {
  margin-top: auto;
  padding-top: 16px;
  width: 50%;
  align-items: center;
  justify-content: center;
}

/* HEADER */
.doc-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}

.logo-box {
  width: 40%;
  display: flex;
  align-items: center;
}

.company-logo {
  width: 200px; 
  height: auto;
  object-fit: contain;
  display: block;
}

.title-box {
  width: 55%;
  text-align: right;
}

.doc-top {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
}

.doc-title {
  font-size: 24px;
  font-weight: 700;
  color: #2b5d86;
  margin-top: 10px;
}

/* LINE */
.line {
  height: 3px;
  background: #2b5d86;
  margin: 20px 0;
}

/* CUSTOMER BOX */
.box {
  border: 1px solid #ccc;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: 12px 15px;
  margin-bottom: 20px;
  gap: 16px;
}

.label {
  font-size: 11px;
  color: #666;
  margin-bottom: 5px;
}

.right-box {
  text-align: right;
  white-space: nowrap;
  flex-shrink: 0;
}

/* TABLE */
.doc-table {
  width: 100%;
  border-collapse: collapse;
}

.doc-table th {
  border-bottom: 2px solid #000;
  padding: 8px;
  font-size: 11px;
  text-transform: uppercase;
}

.doc-table td {
  padding: 8px;
  border-bottom: 1px solid #ddd;
}

.r { text-align: right; }
.c { text-align: center; }

/* TOTALS */
.totals {
  text-align: right;
  margin-top: 10px;
}

.totals span {
  display: inline-block;
  width: 120px;
  text-align: right;
}

.grand {
  font-weight: 700;
  font-size: 18px;
  color: #2b5d86;
}

/* TERMS */
.terms {
  margin-top: 20px;
  border: 1px solid #ccc;
  padding: 10px;
}

.terms-title {
  font-weight: 600;
  margin-bottom: 10px;
}

/* FOOTER IMAGE */
.footer-img {
  position: fixed;
  bottom: 10px;
  left: 0;
  width: 100%;
  text-align: center;
}

.footer-img img {
  max-width: 100%;
  height: auto;
  justify-content: center;
}

.footer-img-box img {
  display: block;
  object-fit: contain;
  object-position: center;
  justify-content: center;
}
.footer-box {
  margin-top: auto;              /* 🔥 pushes to bottom naturally */
  border: 2px solid #1B5886;
  background: #eef5fb;
  padding: 10px 14px;
  font-size: 8.5px;              /* 🔻 tighter like real invoices */
  justify-content: center;
}

/* Company */
.footer-company {
  text-align: center;
  font-weight: 700;
  font-size: 10px;
  margin-bottom: 4px;
  justify-content: center;
}

/* Details */
.footer-details {
  text-align: center;
  font-size: 8px;
  margin-bottom: 6px;
  line-height: 1.3;
}

/* Layout */
.footer-terms-row {
  display: flex;
  justify-content: space-between;
  gap: 15px;
}

/* Terms */
.footer-terms {
  width: 50%;
}

.footer-terms .terms-title {
  font-size: 9px;
  font-weight: 600;
  margin-bottom: 3px;
}

.footer-terms ul {
  margin: 0;
  padding-left: 12px;
}

.footer-terms li {
  margin-bottom: 2px;
  line-height: 1.2;
}

/* Arabic */
.footer-terms.ar {
  direction: rtl;
  text-align: right;
  font-family: "Tahoma", sans-serif;
}

.footer-terms.ar ul {
  padding-right: 12px;
  padding-left: 0;
}
.signature-section {
  display: flex;
  justify-content: space-between;
  margin-top: 40px;
  margin-bottom: 10px;
}

.sign-box {
  width: 40%;
  text-align: center;
}

.sign-line {
  margin-top: 35px;
  border-top: 1px solid #333;
  height: 1px;
}

.sign-label {
  font-size: 10px;
  color: #444;
  margin-bottom: 5px;
}

/* optional alignment tweak */
.sign-box.left {
  text-align: left;
}

.sign-box.right {
  text-align: right;
}

/* ── HAMBURGER BUTTON ── */
.mob-hamburger-btn{
  display:none;align-items:center;justify-content:center;
  width:34px;height:34px;
  background:var(--bg3);border:1px solid var(--border2);
  border-radius:10px;cursor:pointer;font-size:18px;
  transition:all .15s;flex-shrink:0;color:var(--text2);
}
.mob-hamburger-btn:hover{border-color:var(--text3);color:var(--text)}
@media(max-width:768px){
  .mob-hamburger-btn{display:flex!important}
}

/* ── HAMBURGER MENU POPUP ── */
.mob-menu-overlay{
  position:fixed;inset:0;z-index:450;
  background:rgba(0,0,0,.55);
}
.mob-menu-panel{
  position:absolute;top:0;right:0;bottom:0;
  width:min(300px,85vw);
  background:var(--bg2);border-left:1px solid var(--border2);
  display:flex;flex-direction:column;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
}
.mob-menu-profile{
  display:flex;align-items:center;gap:13px;
  padding:20px 18px 16px;
  border-bottom:1px solid var(--border);
  background:var(--bg3);
  flex-shrink:0;
}
.mob-menu-big-avatar{
  width:44px;height:44px;border-radius:50%;
  background:var(--bg4);color:var(--text);
  border:2px solid var(--border2);
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700;flex-shrink:0;
}
.mob-menu-profile-name{font-size:14px;font-weight:600;color:var(--text)}
.mob-menu-profile-role{font-size:11px;color:var(--text3);margin-top:2px}
.mob-menu-profile-email{font-size:10px;color:var(--text3);margin-top:1px}
.mob-menu-close{
  margin-left:auto;width:28px;height:28px;
  border-radius:8px;background:var(--bg4);
  border:1px solid var(--border2);color:var(--text2);
  font-size:16px;cursor:pointer;display:flex;
  align-items:center;justify-content:center;
  transition:all .15s;flex-shrink:0;
}
.mob-menu-close:hover{color:var(--text);border-color:var(--text3)}
.mob-menu-section{
  font-size:9px;color:var(--text3);
  text-transform:uppercase;letter-spacing:.08em;
  padding:12px 18px 5px;
}
.mob-menu-item{
  display:flex;align-items:center;gap:11px;
  padding:11px 18px;cursor:pointer;
  color:var(--text2);font-size:13px;
  transition:all .15s;
  border-left:2px solid transparent;
  border:none;background:transparent;
  width:100%;text-align:left;font-family:'Sora',sans-serif;
}
.mob-menu-item:hover{background:var(--bg3);color:var(--text)}
.mob-menu-item.active{background:var(--bg3);color:var(--text);border-left:2px solid var(--text);font-weight:500}
.mob-menu-icon{font-size:14px;width:18px;text-align:center;flex-shrink:0}
.mob-menu-footer{
  margin-top:auto;padding:14px 18px 20px;
  border-top:1px solid var(--border);
  flex-shrink:0;
}

/* ── EXPENDITURE PAGES ── */
/* ── ONBOARDING OVERLAY ── */
.onboard-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:600;padding:20px;backdrop-filter:blur(4px)}
.onboard-card{width:420px;max-width:100%;background:var(--bg2);border:1px solid var(--border2);border-radius:18px;padding:36px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.onboard-logo{font-size:15px;font-weight:700;color:var(--text);margin-bottom:4px}
.onboard-subtitle{font-size:10px;color:var(--text3);font-family:'JetBrains Mono',monospace;margin-bottom:28px}
.onboard-step-pill{display:inline-flex;gap:5px;margin-bottom:20px}
.onboard-dot{width:7px;height:7px;border-radius:50%;background:var(--bg4);border:1px solid var(--border2);transition:all .2s}
.onboard-dot.active{background:var(--text);border-color:var(--text)}
.onboard-dot.done{background:var(--green);border-color:var(--green)}
.onboard-icon{font-size:32px;margin-bottom:14px;display:block}
.onboard-feature-name{font-size:17px;font-weight:700;color:var(--text);margin-bottom:8px}
.onboard-feature-desc{font-size:13px;color:var(--text2);line-height:1.7;margin-bottom:24px}
.onboard-screen{background:var(--bg3);border:1px solid var(--border2);border-radius:12px;padding:16px;margin-bottom:24px;font-size:11px;color:var(--text3);font-family:'JetBrains Mono',monospace}
.onboard-screen-title{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);margin-bottom:8px}
.onboard-screen-row{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--border);font-size:12px;color:var(--text2)}
.onboard-screen-row:last-child{border-bottom:none}
.onboard-screen-icon{font-size:14px;width:18px;text-align:center;flex-shrink:0}
.onboard-actions{display:flex;align-items:center;justify-content:space-between;gap:10px}
.onboard-progress{font-size:10px;color:var(--text3);font-family:'JetBrains Mono',monospace}
.onboard-skip{font-size:11px;color:var(--text3);cursor:pointer;background:none;border:none;font-family:inherit;padding:0;transition:color .15s}
.onboard-skip:hover{color:var(--text)}
.onboard-next{background:var(--text);color:var(--bg);border:none;padding:10px 28px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity .15s}
.onboard-next:hover{opacity:.85}
@media(max-width:480px){.onboard-card{padding:24px 18px}}

/* ── SETUP LOADER ── */
@keyframes setup-fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes setup-fadeout{from{opacity:1}to{opacity:0}}
@keyframes bar-fill{from{width:0%}to{width:100%}}
@keyframes dot-pulse{0%,80%,100%{opacity:.2;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
@keyframes app-reveal{from{opacity:0;transform:scale(1.008)}to{opacity:1;transform:scale(1)}}

.setup-screen{
  position:fixed;inset:0;z-index:700;
  background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;
  animation:setup-fadein .35s ease both;
}
.setup-screen.fading-out{
  animation:setup-fadeout .55s ease forwards;
  pointer-events:none;
}
.setup-logo-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;animation:setup-fadein .4s .1s ease both;opacity:0}
.setup-logo-icon{font-size:22px}
.setup-logo-text{font-size:16px;font-weight:700;color:var(--text)}
.setup-greeting{font-size:12px;color:var(--text3);font-family:'JetBrains Mono',monospace;margin-bottom:48px;animation:setup-fadein .4s .2s ease both;opacity:0}
.setup-steps-list{display:flex;flex-direction:column;gap:12px;width:300px;margin-bottom:40px}
.setup-step-row{display:flex;align-items:center;gap:12px;animation:setup-fadein .35s ease both;opacity:0}
.setup-step-row:nth-child(1){animation-delay:.3s}
.setup-step-row:nth-child(2){animation-delay:.7s}
.setup-step-row:nth-child(3){animation-delay:1.1s}
.setup-step-row:nth-child(4){animation-delay:1.5s}
.setup-step-icon{width:30px;height:30px;border-radius:8px;background:var(--bg3);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;transition:background .3s,border-color .3s}
.setup-step-icon.done{background:var(--green-bg);border-color:rgba(61,186,120,.35)}
.setup-step-label{font-size:13px;color:var(--text2);flex:1;transition:color .3s}
.setup-step-label.done{color:var(--text)}
.setup-step-check{font-size:13px;color:var(--green);opacity:0;transition:opacity .3s;font-weight:700}
.setup-step-check.show{opacity:1}
.setup-bar-wrap{width:300px;height:3px;background:var(--bg3);border-radius:10px;overflow:hidden;animation:setup-fadein .4s .25s ease both;opacity:0}
.setup-bar-fill{height:100%;background:var(--text);border-radius:10px;width:0%;transition:width .4s cubic-bezier(.4,0,.2,1)}
.setup-dots{display:flex;gap:5px;margin-top:16px;animation:setup-fadein .4s .3s ease both;opacity:0}
.setup-dot{width:5px;height:5px;border-radius:50%;background:var(--text3);animation:dot-pulse 1.4s infinite ease-in-out}
.setup-dot:nth-child(1){animation-delay:0s}
.setup-dot:nth-child(2){animation-delay:.2s}
.setup-dot:nth-child(3){animation-delay:.4s}

/* ── HOME FADE-IN ── */
.app-fadein{animation:app-reveal .6s cubic-bezier(.4,0,.2,1) both}
.exp-filter-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.exp-filter-bar input,.exp-filter-bar select{width:auto;flex:1;min-width:120px;max-width:200px}
.exp-stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.exp-stat{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:16px 18px}
.exp-stat-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.exp-stat-value{font-size:20px;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--text)}
.exp-category-tag{display:inline-flex;padding:2px 8px;border-radius:6px;font-size:10px;background:var(--bg4);color:var(--text2);border:1px solid var(--border2)}
.exp-action-row{display:flex;gap:6px;align-items:center}

/* ── AUDIT LOG PAGE ── */
.audit-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.audit-toolbar input,.audit-toolbar select{width:auto;flex:1;min-width:130px;max-width:210px}
.audit-count{font-size:11px;color:var(--text3);font-family:'JetBrains Mono',monospace;white-space:nowrap;padding:7px 0}
.audit-row{display:grid;grid-template-columns:160px 120px 1fr auto;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .13s;font-size:12px}

// Renders one HTML block into the open jsPDF doc starting at a given page.
// Returns a promise that resolves when done.
function renderBlockToPDF(jsdoc, htmlContent, isFirstPage) {
  return new Promise((resolve) => {
    const A4_W_MM = 210;
    const A4_H_MM = 297;
    const RENDER_W = 794; // A4 at 96dpi

    const container = document.createElement('div');
    container.style.cssText = [
      'position:fixed',
      'top:-99999px',
      'left:-99999px',
      'width:' + RENDER_W + 'px',
      'background:#fff',
      'font-family:Sora,sans-serif',
      'font-size:13px',
      'color:#111',
      'box-sizing:border-box',
      'padding:32px 40px',
      'overflow:visible'
    ].join(';');
    container.innerHTML = htmlContent;
    document.body.appendChild(container);

    // Wait for all images to load before capturing
    const imgs = Array.from(container.querySelectorAll('img'));
    const waitImgs = imgs.map(img => new Promise(r => {
      if (img.complete && img.naturalWidth > 0) { r(); return; }
      img.onload = r; img.onerror = r;
    }));

    Promise.all(waitImgs).then(() => {
      html2canvas(container, {
        scale: 2,
        useCORS: true,
        allowTaint: false,
        width: RENDER_W,
        windowWidth: RENDER_W,
        backgroundColor: '#ffffff'
      }).then(canvas => {
        document.body.removeChild(container);

        // canvas is 2x scale, so actual px per A4 page height:
        const scale = 2;
        const pageHeightPx = Math.round((A4_H_MM / A4_W_MM) * RENDER_W * scale);
        const totalPages = Math.ceil(canvas.height / pageHeightPx);

        for (let p = 0; p < totalPages; p++) {
          if (!isFirstPage || p > 0) jsdoc.addPage();

          // Slice this page's strip out of the full canvas
          const sliceCanvas = document.createElement('canvas');
          sliceCanvas.width  = canvas.width;
          sliceCanvas.height = pageHeightPx;
          const ctx = sliceCanvas.getContext('2d');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, sliceCanvas.width, sliceCanvas.height);
          ctx.drawImage(canvas, 0, p * pageHeightPx, canvas.width, pageHeightPx, 0, 0, canvas.width, pageHeightPx);

          const imgData = sliceCanvas.toDataURL('image/jpeg', 0.97);
          jsdoc.addImage(imgData, 'JPEG', 0, 0, A4_W_MM, A4_H_MM);
        }

        resolve();
      });
    });
  });
}

function exportToPDF(pages, filename) {
  const { jsPDF } = window.jspdf;
  const jsdoc = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });

  pages.reduce((promise, html, i) => {
    return promise.then(() => renderBlockToPDF(jsdoc, html, i === 0));
  }, Promise.resolve()).then(() => {
    jsdoc.save(filename);
  });
}

function printWithImages(html) {
  // Legacy fallback — kept for any direct callers
  const container = document.getElementById("print-area");
  container.innerHTML = html;
  const images = container.querySelectorAll("img");
  let loaded = 0;
  if (images.length === 0) { window.print(); return; }
  images.forEach(img => {
    if (img.complete) { loaded++; if (loaded === images.length) window.print(); }
    else {
      img.onload = () => { loaded++; if (loaded === images.length) window.print(); };
      img.onerror = () => { loaded++; if (loaded === images.length) window.print(); };
    }
  });
}

}

function Login({onLogin,users,theme,setTheme}){
  const [email,setEmail]=useState('');
  const [pass,setPass]=useState('');
  const [err,setErr]=useState('');
  const [loading,setLoading]=useState(false); 

  const handle = () => {
    setErr('');
    setLoading(true);

    fetch("https://mkaerp-production.up.railway.app/login", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        email: email,
        password: pass
      })
    })
    .then(async res => {
      if (!res.ok) {
        const text = await res.text();
        throw new Error(text || "Login failed");
      }
      return res.json();
    })
    .then(user => {
      if (!user.active) {
        setErr("Account disabled.");
        setLoading(false);
        return;
      }

      console.log("Logged in user:", user);
      onLogin(user);
      setLoading(false);
    })
    .catch(err => {
      console.error(err);
      setErr(err.message || "Invalid credentials.");
      setLoading(false); // ✅ FIX 2
    });
  };

  // ✅ SAFE GROUPING (no crash if users empty)
  const grouped={};
  if(users && users.length){
    users.forEach(u=>{
      if(!grouped[u.role])grouped[u.role]=[];
      grouped[u.role].push(u);
    });
  }

  const roleLabels={
    owner:'Owners',
    employee:'Employees',
    admin:'Admin',
    accountant:'Accountants'
  };

  return React.createElement('div',{className:'login-wrap'},
    React.createElement('div',{className:'login-card'},
      React.createElement('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:24}},
        React.createElement('div',null,
          React.createElement('div',{style:{fontSize:18,fontWeight:700,color:'var(--text)'}},'⚙ MKA ERP'),

// ── Shared helper: build 6-month window labels + values ──────────────────────
function buildSixMonths(){
  const now=new Date();
  const months=[];
  for(let i=5;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    months.push({
      label:d.toLocaleString('default',{month:'short'}),
      year:d.getFullYear(),
      month:d.getMonth()+1,           // 1-12
      key:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`
    });
  }
  return months;
}

function SalesVsTargetChart({salesByMonth,targetByMonth,months,height=90}){
  const vals=months.map(m=>({
    s:salesByMonth[m.key]||0,
    t:targetByMonth[m.key]||0
  }));
  const mx=Math.max(...vals.flatMap(v=>[v.s,v.t]),1);
  return React.createElement('div',null,
    React.createElement('div',{style:{display:'flex',gap:14,marginBottom:10}},
      [{c:'var(--green)',l:'Sales'},{c:'var(--text3)',l:'Target',dash:true}].map(x=>
        React.createElement('div',{key:x.l,style:{display:'flex',alignItems:'center',gap:5,fontSize:10,color:'var(--text2)'}},
          React.createElement('div',{style:{width:20,height:3,background:x.c,borderRadius:2,opacity:x.dash?.5:1}}),x.l
        )
      )
    ),
    React.createElement('div',{style:{display:'flex',alignItems:'flex-end',gap:4,height}},
      months.map((m,i)=>{
        const {s,t}=vals[i];
        const barH=h=>`${Math.max((h/mx)*100,h>0?2:0)}%`;
        const hit=s>=t&&t>0;
        return React.createElement('div',{key:m.key,style:{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:2}},
          React.createElement('div',{style:{width:'100%',display:'flex',gap:2,alignItems:'flex-end',height:height-16,position:'relative'}},
            // target bar (ghost)
            React.createElement('div',{style:{flex:1,height:barH(t),background:'var(--text3)',borderRadius:'3px 3px 0 0',opacity:.25}}),
            // sales bar
            React.createElement('div',{style:{flex:1,height:barH(s),background:hit?'var(--green)':'var(--amber)',borderRadius:'3px 3px 0 0',opacity:.9}})
          ),
          React.createElement('div',{style:{fontSize:9,color:'var(--text3)',marginTop:2}},m.label)
        );

// ── Shared Excel export helper ────────────────────────────────────────────────
async function ensureXLSX(){
  if(window.XLSX)return window.XLSX;
  await new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload=res;s.onerror=rej;
    document.head.appendChild(s);
  });
  return window.XLSX;
}

function SalesTargetsPage({user,data,setData,notify}){
  const {users=[],salesTargets=[],documents=[]}=data;
  const employees=users.filter(u=>u.role==='employee');
  const invoices=documents.filter(d=>d.type==='invoice'&&d.status==='approved');
  const months=buildSixMonths();
  const now=new Date();
  const [selYear,setSelYear]=useState(now.getFullYear());
  const [selMonth,setSelMonth]=useState(now.getMonth()+1);
  const [saving,setSaving]=useState({});
  const [exporting,setExporting]=useState(false);
  const [expanded,setExpanded]=useState({});  // empId -> bool
  const [inputs,setInputs]=useState({});

  const getKey=(empId,y,m)=>`${empId}_${y}_${m}`;
  const getTarget=(empId,y,m)=>{
    const found=salesTargets.find(t=>t.employee_id===empId&&t.year===y&&t.month===m);
    return found?Number(found.target):0;
  };
  const getSales=(empId,y,m)=>{
    const key=`${y}-${String(m).padStart(2,'0')}`;
    return invoices.filter(inv=>inv.employeeId===empId&&inv.created&&inv.created.startsWith(key))
      .reduce((s,inv)=>s+inv.total,0);
  };
  const saveTarget=async(empId,y,m)=>{
    const k=getKey(empId,y,m);
    const val=Number(inputs[k]!==undefined?inputs[k]:getTarget(empId,y,m));
    if(isNaN(val)||val<0)return;
    setSaving(s=>({...s,[k]:true}));
    try{
      const res=await fetch('https://mkaerp-production.up.railway.app/sales-targets',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({employee_id:empId,year:y,month:m,target:val})
      });
      const updated=await res.json();
      setData(prev=>{
        const existing=prev.salesTargets.filter(t=>!(t.employee_id===empId&&t.year===y&&t.month===m));
        return {...prev,salesTargets:[...existing,updated]};
      });
      setInputs(s=>{const n={...s};delete n[k];return n;});
      notify('Target saved','success');
    }catch(e){notify('Failed to save','error');}
    setSaving(s=>{const n={...s};delete n[k];return n;});
  };

  // ── Excel export ────────────────────────────────────────────────────────────
  const exportExcel=async()=>{
    setExporting(true);
    try{
      const XLSX=await ensureXLSX();
      const wb=XLSX.utils.book_new();
      const monthNames=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

      // ── Sheet 1: Monthly Summary (all employees, selected year) ──
      const summaryRows=[
        ['MKA ERP — Sales Targets Report','','','','',''],
        ['Year: '+selYear,'','Generated: '+new Date().toLocaleDateString('en-GB'),'','',''],
        [],
        ['Employee',...monthNames,'Total Sales','Total Target','Achievement'],
      ];
      employees.forEach(emp=>{
        const monthlySales=[];
        let totalSales=0,totalTarget=0;
        for(let m=1;m<=12;m++){
          const s=getSales(emp.id,selYear,m);
          monthlySales.push(parseFloat(s.toFixed(3)));
          totalSales+=s;
          totalTarget+=getTarget(emp.id,selYear,m);
        }
        const pct=totalTarget>0?parseFloat(((totalSales/totalTarget)*100).toFixed(1)):null;
        summaryRows.push([emp.name,...monthlySales,parseFloat(totalSales.toFixed(3)),parseFloat(totalTarget.toFixed(3)),pct!==null?pct+'%':'No target']);
      });
      // Totals row
      const totSales=employees.reduce((s,e)=>s+([...Array(12)].reduce((ms,_,mi)=>ms+getSales(e.id,selYear,mi+1),0)),0);
      const totTarget=employees.reduce((s,e)=>s+([...Array(12)].reduce((mt,_,mi)=>mt+getTarget(e.id,selYear,mi+1),0)),0);
      summaryRows.push([]);
      summaryRows.push(['TOTAL (All Employees)',...[...Array(12)].map((_,mi)=>parseFloat(employees.reduce((s,e)=>s+getSales(e.id,selYear,mi+1),0).toFixed(3))),parseFloat(totSales.toFixed(3)),parseFloat(totTarget.toFixed(3)),totTarget>0?parseFloat(((totSales/totTarget)*100).toFixed(1))+'%':'—']);
      const ws1=XLSX.utils.aoa_to_sheet(summaryRows);
      ws1['!cols']=[{wch:20},...Array(12).fill({wch:10}),{wch:14},{wch:14},{wch:14}];
      XLSX.utils.book_append_sheet(wb,ws1,'Monthly Summary');

      // ── Sheet 2: Invoice Detail (all employees, all time) ──
      const detailRows=[
        ['MKA ERP — Sales Invoice Detail','','','','','',''],
        ['Generated: '+new Date().toLocaleDateString('en-GB'),'','','','','',''],
        [],
        ['Invoice ID','Date','Employee','Customer','Items','Total (OMR)','Target (Month)']
      ];
      const sortedInvs=[...invoices].sort((a,b)=>(a.created||'').localeCompare(b.created||''));
      sortedInvs.forEach(inv=>{
        const [y,m]=inv.created?inv.created.split('-').map(Number):[null,null];
        const tgt=y&&m?getTarget(inv.employeeId,y,m):0;
        detailRows.push([
          inv.id,
          inv.created||'',
          inv.employeeName||'',
          inv.customerName||'',
          inv.items.length,
          parseFloat(Number(inv.total).toFixed(3)),
          tgt>0?parseFloat(tgt.toFixed(3)):''
        ]);
      });
      const ws2=XLSX.utils.aoa_to_sheet(detailRows);
      ws2['!cols']=[{wch:20},{wch:12},{wch:18},{wch:22},{wch:8},{wch:14},{wch:14}];
      XLSX.utils.book_append_sheet(wb,ws2,'Invoice Detail');

      // ── One sheet per employee ──
      employees.forEach(emp=>{
        const empInvs=invoices.filter(i=>i.employeeId===emp.id).sort((a,b)=>(a.created||'').localeCompare(b.created||''));
        const rows=[
          [emp.name+' — Sales Report','','','',''],
          ['Generated: '+new Date().toLocaleDateString('en-GB'),'','','',''],
          [],
          ['Invoice ID','Date','Customer','Items','Total (OMR)']
        ];
        let grandTotal=0;
        empInvs.forEach(inv=>{
          rows.push([inv.id,inv.created||'',inv.customerName||'',inv.items.length,parseFloat(Number(inv.total).toFixed(3))]);
          grandTotal+=Number(inv.total);
        });
        rows.push([]);
        rows.push(['','','','Grand Total',parseFloat(grandTotal.toFixed(3))]);
        // Monthly summary for this employee
        rows.push([]);
        rows.push(['Month','Target (OMR)','Sales (OMR)','Achievement']);
        for(let mi=0;mi<12;mi++){
          const s=getSales(emp.id,selYear,mi+1);
          const t=getTarget(emp.id,selYear,mi+1);
          const pct=t>0?parseFloat(((s/t)*100).toFixed(1)):null;
          rows.push([monthNames[mi]+' '+selYear,t>0?parseFloat(t.toFixed(3)):'',parseFloat(s.toFixed(3)),pct!==null?pct+'%':'—']);
        }
        const wsEmp=XLSX.utils.aoa_to_sheet(rows);
        wsEmp['!cols']=[{wch:20},{wch:12},{wch:22},{wch:8},{wch:14}];

   Owners still get the lightweight card-based approval UI below.

function getPriority(inv){
  const hoursOld=(Date.now()-new Date(inv.created).getTime())/3600000;
  const discount=parseFloat(inv.discount_pct||inv.discountPct||0);
  if(inv.total>=1000||discount>=15) return 'critical';
  if(hoursOld>=48||inv.total>=400||discount>=8) return 'high';
  return 'standard';
}
function priorityLabel(p){
  if(p==='critical') return '🔴 Critical';
  if(p==='high') return '🟠 High';
  return '🟢 Standard';
}
function ageLabel(created){
  const h=Math.floor((Date.now()-new Date(created).getTime())/3600000);
  if(h<1) return '<1h ago';
  if(h<24) return h+'h ago';
  return Math.floor(h/24)+'d ago';
}

function ApprovedInvoicesPage({user,data,setData,notify}){
  const approved=(data.documents||[]).filter(d=>d.type==='invoice'&&d.status==='approved');
  const canGen=user.role==='accountant';
  const [lpoModal,setLpoModal]=useState(null);
  const [lpoNo,setLpoNo]=useState('');
  const [lpoDate,setLpoDate]=useState('');
  // Re-print confirmation state
  const [reprintModal,setReprintModal]=useState(null);
  const [reprintLpoNo,setReprintLpoNo]=useState('');
  const [reprintLpoDate,setReprintLpoDate]=useState('');

  const openLpoModal=id=>{
    const inv=(data.documents||[]).find(d=>d.id===id);
    if(!inv)return;
    setLpoNo(inv.lpoNo||'');
    setLpoDate(inv.lpoDate||'');
    setLpoModal(inv);
  };

  const openReprintModal=inv=>{
    setReprintLpoNo(inv.lpoNo||'');
    setReprintLpoDate(inv.lpoDate||'');
    setReprintModal(inv);
  };

  // Helper: check stock against per-product thresholds after generation
  const checkThresholds=(inv,products)=>{
    const alerts=[];
    inv.items.forEach(it=>{
      const p=products.find(p=>p.id===it.productId||normalize(p.name)===normalize(it.name));
      if(p){
        const newStock=Math.max(0,p.stock-(parseInt(it.qty)||1));
        const threshold=Number(p.reorderThreshold||10);
        if(newStock===0) alerts.push(p.name+' is now OUT OF STOCK');
        else if(newStock<=threshold) alerts.push(p.name+' is LOW — '+newStock+' left (threshold: '+threshold+')');
      }
    });
    return alerts;
  };

  const generate=()=>{
    const inv=lpoModal;
    if(!inv)return;
    const updatedInv={...inv,lpoNo:lpoNo||'',lpoDate:lpoDate||''};
    setData(d=>{
      const documents=d.documents.map(doc=>doc.id===inv.id?{...doc,accountantSent:true,lpoNo:lpoNo||'',lpoDate:lpoDate||''}:doc);
      let products=[...d.products];
      inv.items.forEach(it=>{
        const qty=parseInt(it.qty)||1;
        products=products.map(p=>{
          if(p.id===it.productId||normalize(p.name)===normalize(it.name)){
            return{...p,stock:Math.max(0,p.stock-qty)};
          }
          return p;
        });
      });
      return{...d,documents,products};
    });
    const alerts=checkThresholds(inv,data.products);
    if(alerts.length) setTimeout(()=>notify('\u26a0 Stock alert: '+alerts.join(' | '),'error'),600);

    // Persist LPO + accountant_sent to DB
    fetch(`https://mkaerp-production.up.railway.app/documents/${inv.id}/lpo`,{
      method:'PATCH',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({lpo_no:lpoNo||'',lpo_date:lpoDate||null,accountant_sent:true})
    }).catch(err=>console.error('LPO save failed:',err));

    notify('Invoice generated \u2014 printing\u2026','success');
    setLpoModal(null);
    setTimeout(()=>printInvoice(updatedInv),400);
  };

  const confirmReprint=()=>{
    const inv=reprintModal;
    if(!inv)return;
    // Update LPO if changed during re-print confirmation
    const updatedInv={...inv,lpoNo:reprintLpoNo||inv.lpoNo,lpoDate:reprintLpoDate||inv.lpoDate};
    if(reprintLpoNo!==inv.lpoNo||reprintLpoDate!==inv.lpoDate){
      fetch(`https://mkaerp-production.up.railway.app/documents/${inv.id}/lpo`,{
        method:'PATCH',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({lpo_no:reprintLpoNo,lpo_date:reprintLpoDate||null,accountant_sent:true})
      }).catch(err=>console.error('LPO update failed:',err));
      setData(d=>({...d,documents:d.documents.map(doc=>doc.id===inv.id?{...doc,lpoNo:reprintLpoNo,lpoDate:reprintLpoDate}:doc)}));
    }
    logAction(user,'invoice',user.name+' reprinted invoice '+inv.id+' for '+inv.customerName,{invoice:inv.id,customer:inv.customerName});
    setReprintModal(null);
    notify('Reprinting\u2026','success');
    setTimeout(()=>printInvoice(updatedInv),300);
  };

  return React.createElement('div',null,
    approved.length===0?React.createElement('div',{className:'card'},React.createElement('div',{className:'empty'},React.createElement('div',{style:{fontSize:12}}))):

        React.createElement('div',{style:{display:'flex',justifyContent:'space-between',marginBottom:12}},

          ),

            React.createElement('div',{className:'approval-banner',style:{marginTop:8}},'\u2713 '+inv.approvedBy+(inv.approvedAt?' \u00b7 '+inv.approvedAt:''))

function CustomersPage({user,data,setData,notify}){
  const {leads,products,users=[]}=data;
  const isEmployee=user.role==='employee';
  const canSeeAll=!isEmployee; // owner, admin, accountant

  const [showModal,setShowModal]=useState(false);
  const [editLead,setEditLead]=useState(null);
  const [statusFilter,setStatusFilter]=useState('all');
  const [empFilter,setEmpFilter]=useState('all');   // 'all' | empId string
  const [search,setSearch]=useState('');
  const empty={name:'',phone:'',source:'Instagram',product:'',status:'new',notes:'',address:''};
  const [form,setForm]=useState(empty);
  const BASE='https://mkaerp-production.up.railway.app';

  // Build employee list for the dropdown (only employees role)
  const employees=users.filter(u=>u.role==='employee');
  // Name lookup map for display in table
  const userMap={};
  users.forEach(u=>{userMap[u.id]=u.name;});

  // Scope: employees only see their own
  const scopedLeads=isEmployee?leads.filter(l=>l.employeeId===user.id):leads;

  // Apply filters
  const filtered=scopedLeads.filter(l=>{
    const matchStatus=statusFilter==='all'||l.status===statusFilter;
    const matchEmp=!canSeeAll||empFilter==='all'||String(l.employeeId)===String(empFilter);
    const matchSearch=!search.trim()||
      l.name.toLowerCase().includes(search.toLowerCase())||
      (l.phone||'').includes(search)||
      (l.product||'').toLowerCase().includes(search.toLowerCase());
    return matchStatus&&matchEmp&&matchSearch;
  });

  const save=async()=>{
    if(!form.name.trim()){notify('Name required','error');return;}
    const payload={
      name:form.name,phone:form.phone,source:form.source,
      product:form.product,status:form.status,
      notes:form.notes,address:form.address,
      employee_id:user.id,
      created:new Date().toISOString().split('T')[0]
    };
    try{
      if(editLead){
        const r=await fetch(BASE+'/leads/'+editLead.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
        if(!r.ok){const e=await r.json();throw new Error(e.error||'Update failed');}
        const updated=await r.json();
        setData(d=>({...d,leads:d.leads.map(l=>l.id===editLead.id?{...updated,employeeId:Number(updated.employee_id)}:l)}));
        logAction(user,'customer',user.name+' updated customer '+form.name,{customer:form.name});
        notify('Updated','success');
      }else{
        const r=await fetch(BASE+'/leads',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
        if(!r.ok){const e=await r.json();throw new Error(e.error||'Create failed');}
        const created=await r.json();
        setData(d=>({...d,leads:[{...created,employeeId:Number(created.employee_id)},...d.leads]}));
        logAction(user,'customer',user.name+' created customer '+form.name,{customer:form.name,source:form.source});
        notify('Customer added','success');
      }
      setShowModal(false);
    }catch(e){notify('Save failed: '+e.message,'error');console.error(e);}
  };

  return React.createElement('div',null,
    // ── Toolbar ──

          onClick:()=>setStatusFilter(s)
        },s==='all'?'All':s.charAt(0).toUpperCase()+s.slice(1)))
      ),

        value:empFilter,
        onChange:e=>setEmpFilter(e.target.value),

      },
        React.createElement('option',{value:'all'},'All Employees'),
        employees.map(e=>React.createElement('option',{key:e.id,value:String(e.id)},e.name))
      ),
      // Search
      React.createElement('input',{
        type:'text',placeholder:'🔍 Search name, phone, product…',
        value:search,onChange:e=>setSearch(e.target.value),

      React.createElement('button',{className:'btn btn-primary',onClick:()=>{setForm(empty);setEditLead(null);setShowModal(true)}},'+ Add Customer')

function ProductsPage({ user, data, setData, notify }) {
  const products = data.products || [];

  const [showEdit, setShowEdit] = useState(null);
  const [ef, setEf] = useState({});
  const [search, setSearch] = useState('');
  const [stockFilter, setStockFilter] = useState('all');
  const [categoryFilter, setCategoryFilter] = useState('all');

  const isAdmin = user.role === 'admin';
  const isEmployee = user.role === 'employee';
  const saveEdit = () => {
    if (!ef.name.trim()) {
      notify('Name required', 'error');
      return;
    }
    const prev = showEdit;
    const stockBefore = Number(prev.stock);
    const stockAfter  = Number(ef.stock);
    const stockChanged = stockBefore !== stockAfter;

    // Persist to backend
    fetch(`https://mkaerp-production.up.railway.app/products/${prev.id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: ef.name, price: ef.price, stock: stockAfter, category: ef.category })
    }).catch(err => console.error('Product save failed:', err));

    setData(d => ({
      ...d,
      products: (d.products || []).map(p =>
        p.id === prev.id ? { ...p, ...ef, stock: stockAfter } : p
      )
    }));

    // Always log the edit; log stock changes with before/after detail
    if (stockChanged) {
      logAction(user, 'product',
        user.name + ' adjusted stock for "' + ef.name + '": ' + stockBefore + ' → ' + stockAfter,
        { product: ef.name, product_id: prev.id, stock_before: stockBefore, stock_after: stockAfter, delta: stockAfter - stockBefore }
      );
    } else {
      logAction(user, 'product',
        user.name + ' updated product: ' + ef.name,
        { product: ef.name, product_id: prev.id, price: ef.price, category: ef.category }
      );
    }

    notify(stockChanged
      ? 'Stock updated: ' + stockBefore + ' → ' + stockAfter + ' units'
      : 'Product updated', 'success');
    setShowEdit(null);
  };

  const categories = ['all', ...Array.from(new Set(products.map(p => p.category).filter(Boolean))).sort()];

  const filtered = products.filter(p => {
    const matchSearch = !search ||
      p.name.toLowerCase().includes(search.toLowerCase()) ||
      (p.category || '').toLowerCase().includes(search.toLowerCase());
    const matchStock =
      stockFilter === 'all' ? true :
      stockFilter === 'out-of-stock' ? p.stock === 0 :
      stockFilter === 'low-stock' ? p.stock > 0 && p.stock <= 10 :
      stockFilter === 'in-stock' ? p.stock > 10 : true;
    const matchCategory = categoryFilter === 'all' || p.category === categoryFilter;
    return matchSearch && matchStock && matchCategory;
  });

  const R = React.createElement;

  return R('div', null,

    R('div', { className: 'grid-3', style: { marginBottom: 18 } },
      [
        { label: 'Total', val: products.length },
        { label: 'In Stock', val: products.filter(p => p.stock > 0).length },
        { label: 'Out of Stock', val: products.filter(p => p.stock === 0).length }
      ].map(m =>
        R('div', { key: m.label, className: 'metric' },
          R('div', { className: 'metric-label' }, m.label),
          R('div', { className: 'metric-value' }, m.val)
        )
      )
    ),

    R('div', { className: 'card' },

      R('div', {
        style: {
          display: 'flex',
          alignItems: 'center',
          justifyContent: 'space-between',
          marginBottom: 14,
          flexWrap: 'wrap',
          gap: 10
        }
      },
        R('div', { className: 'card-title', style: { margin: 0 } }, 'Product Catalog'),
        R('div', { style: { display: 'flex', gap: 8, flexWrap: 'wrap', alignItems: 'center' } },
          R('input', {
            type: 'text',
            placeholder: '🔍 Search products…',
            value: search,
            onChange: e => setSearch(e.target.value),
            style: { width: 200, fontSize: 12, padding: '6px 10px' }
          }),
          R('select', {
            value: stockFilter,
            onChange: e => setStockFilter(e.target.value),
            style: { fontSize: 12, padding: '6px 10px', width: 150 }
          },
            R('option', { value: 'all' }, 'All Stock'),
            R('option', { value: 'in-stock' }, 'In Stock (>10)'),
            R('option', { value: 'low-stock' }, 'Low Stock (1–10)'),
            R('option', { value: 'out-of-stock' }, 'Out of Stock')
          ),
          R('select', {
            value: categoryFilter,
            onChange: e => setCategoryFilter(e.target.value),
            style: { fontSize: 12, padding: '6px 10px', width: 150 }
          },
            categories.map(c =>
              R('option', { key: c, value: c }, c === 'all' ? 'All Categories' : c)
            )
          )
        )
      ),

      R('div', { className: 'tbl-scroll' },
        R('table', null,
          R('thead', null,
            R('tr', null,
              R('th', null, 'Product'),
              R('th', null, 'Category'),
              !isEmployee && R('th', null, 'Price'),
              R('th', null, isEmployee ? 'Stock Status' : 'Stock'),
              !isEmployee && R('th', null, 'Status'),
              isAdmin && R('th', null, '')
            )
          ),
          R('tbody', null,
            filtered.length === 0
              ? R('tr', null,
                  R('td', {
                    colSpan: 7,
                    style: { textAlign: 'center', padding: 20, color: 'var(--text3)' }
                  }, products.length === 0 ? 'No products found' : 'No products match your filter')
                )
              : filtered.map(p =>
                  R('tr', { key: p.id },
                    R('td', { className: 'primary' }, p.name),
                    R('td', null, p.category),
                    !isEmployee && R('td', null,
                      R('span', { style: { fontFamily: "'JetBrains Mono', monospace" } },
                        `OMR ${Number(p.price || 0).toFixed(2)}`)
                    ),
                    R('td', null,
                      isEmployee
                        ? R('span', {
                            className: `badge ${p.stock === 0 ? 'rejected' : p.stock <= 10 ? 'low-stock' : 'in-stock'}`
                          },
                            p.stock === 0 ? 'Out of stock' : p.stock <= 10 ? 'Low stock' : 'In stock'
                          )
                        : p.stock
                    ),
                    !isEmployee && R('td', null,
                      R('span', {
                        className: `badge ${
                          p.stock === 0 ? 'rejected' :
                          p.stock <= 10 ? 'low-stock' : 'in-stock'
                        }`
                      },
                        p.stock === 0 ? 'Out of stock' :
                        p.stock <= 10 ? 'Low stock' : 'In stock'
                      )
                    ),
                    isAdmin && R('td', null,
                      R('button', {
                        className: 'btn btn-ghost btn-sm',
                        onClick: () => {
                          setEf({
                            name: p.name,
                            price: p.price,
                            stock: p.stock,
                            category: p.category
                          });
                          setShowEdit(p);
                        }
                      }, 'Edit')
                    )
                  )
                )
          )
        )
      )
    ),

    showEdit && R('div', { className: 'modal-overlay' },
      R('div', { className: 'modal', style: { maxWidth: 440 } },
        R('div', { className: 'modal-title' }, 'Edit Product'),
        R('div', { className: 'form-grid' },
          R('div', { className: 'form-group' },
            R('label', null, 'Name'),
            R('input', {
              value: ef.name,
              onChange: e => setEf(f => ({ ...f, name: e.target.value }))
            })
          ),
          R('div', { className: 'form-group' },
            R('label', null, 'Category'),
            R('input', {
              value: ef.category,
              onChange: e => setEf(f => ({ ...f, category: e.target.value }))
            })
          ),
          R('div', { className: 'form-row' },
            R('div', { className: 'form-group' },
              R('label', null, 'Price'),
              R('input', {
                type: 'number',
                value: ef.price,
                onChange: e => setEf(f => ({ ...f, price: e.target.value }))
              })
            ),
            R('div', { className: 'form-group' },
              R('label', null, 'Stock'),
              R('input', {
                type: 'number',
                value: ef.stock,
                onChange: e => setEf(f => ({ ...f, stock: e.target.value }))
              }),
              showEdit && Number(ef.stock) !== Number(showEdit.stock) &&
                R('div', { style: { fontSize: 10, color: 'var(--amber)', marginTop: 3 } },
                  'Was: ' + showEdit.stock + ' \u2192 Now: ' + ef.stock + ' (delta: ' + (Number(ef.stock) - Number(showEdit.stock)) + ')'
                )
            )
          )
        ),
        R('div', { className: 'modal-actions' },
          R('button', {
            className: 'btn btn-ghost',
            onClick: () => setShowEdit(null)
          }, 'Cancel'),
          R('button', {
            className: 'btn btn-primary',
            onClick: saveEdit
          }, 'Save')
        )
      )
    )
  );
}

function CreateInvoice({user,data,setData,notify}){
  const {products}=data;
  const [customer,setCustomer]=useState('');
  const [phone,setPhone]=useState('');
  const [address,setAddress]=useState('');
  const [comment,setComment]=useState('');
  const [terms,setTerms]=useState({payment:'50% advance, 50% on delivery',delivery:'Within 7 working days',warranty:'1 year manufacturer warranty',validity:'Valid for 30 days'});
  const [items,setItems]=useState([{productId:'',qty:1,manualPrice:''}]);
  const [discountPct,setDiscountPct]=useState(0);
  const [discountTitle,setDiscountTitle]=useState('');
  const subTotal = items.reduce((s,item)=>{
    const price = parseFloat(item.manualPrice||0);
    return s + (price * parseInt(item.qty||0));
  },0);
  const discountAmt =
    subTotal * (parseFloat(discountPct||0) / 100);
  const discountedSubTotal =
    subTotal - discountAmt;
  const vat =
    discountedSubTotal * 0.05;
  const total =
    discountedSubTotal + vat;

  const submit = () => {
    if(!customer.trim()){
      notify('Customer name required','error');
      return;
    }

    if(discountPct < 0 || discountPct > 20){
      notify('Discount must be between 0% and 20%','error');
      return;
    }

    if(discountPct > 0 && !discountTitle.trim()){
      notify('Enter discount reason','error');
      return;
    }

    const valid = items.filter(i => i.productId && parseInt(i.qty) > 0);

    if(!valid.length){
      notify('Add at least one product','error');
      return;
    }

    const builtItems = valid.map(i => {
      const p = products.find(p => p.id === parseInt(i.productId));
      return {
        productId: p ? p.id : null,
        name: p ? p.name : '',
        qty: parseInt(i.qty),
        price: parseFloat(i.manualPrice||0)
      };
    });

    const id = genId('INV');
    const newDoc = {
      id,
      type: "invoice",
      status: "pending",
      employee_id: user.id,
      customer_name: customer,
      customer_phone: phone,
      customer_address: address,
      customer_ref: "",
      mka_ref: "",
      company_name: "",
      promo_code: "",
      lpo_no: "",
      lpo_date: null,
      total,
      created: new Date().toISOString(),
      terms: {...terms, comment: comment||''},
      items: builtItems,
      discount_pct: parseFloat(discountPct || 0),
      discount_title: discountTitle || ''
    };

    // 🔥 SAVE TO DB
    fetch("https://mkaerp-production.up.railway.app/documents", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(newDoc)
    })
    .then(async res => {
      const data = await res.json();
      if (!res.ok) {
        throw new Error(data.error || data.message || 'Failed');
      }
      return data;
    })
    .then(saved => {
      notify('Invoice submitted for approval','success');
      logAction(user,'invoice',user.name+' created invoice for '+customer+' — OMR '+total.toFixed(2),{customer,total:total.toFixed(2),items:builtItems.length});

      setData(d => ({
        ...d,
        documents: [
          {
            id: saved.id || id,
            type: 'invoice',
            employeeId: user.id,
            employeeName: user.name,
            customerName: customer,
            customerPhone: phone,
            customerAddress: address,
            customerRef: '',
            mkaRef: '',
            companyName: '',
            promoCode: '',
            lpoNo: '',
            lpoDate: '',
            status: 'pending',
            total,
            created: new Date().toISOString().split('T')[0],
            comment,
            approvedBy: null,
            approvedAt: null,
            rejectionNote: '',
            items: builtItems,
            discountPct: parseFloat(discountPct || 0),
          discountTitle: discountTitle || '',
          discountAmt,
          subTotal,
          vat,
          gross: total,
            terms,
            accountantSent: false,
            deliveryDate: '',
            deliveryDone: false,
            deliveryDoneDate: '',
          },
          ...d.documents
        ]
      }));

      // reset form
      setCustomer('');
      setPhone('');
      setAddress('');
      setComment('');
      setTerms({payment:'50% advance, 50% on delivery',delivery:'Within 7 working days',warranty:'1 year manufacturer warranty',validity:'Valid for 30 days'});
      setItems([{productId:'',qty:1,manualPrice:''}]);

    })
    .catch(err => {
      console.error(err);
      notify('Failed to save invoice: '+err.message,'error');
    });
  };
  return React.createElement('div',{className:'grid-2'},
    React.createElement('div',{style:{display:'flex',flexDirection:'column',gap:16}},
      React.createElement('div',{className:'card'},
        React.createElement('div',{className:'card-title'},'Customer Details'),
        React.createElement('div',{className:'form-grid'},
          React.createElement('div',{className:'form-group'},React.createElement('label',null,'Customer Name'),React.createElement('input',{value:customer,onChange:e=>setCustomer(e.target.value),placeholder:'Full name'})),
          React.createElement('div',{className:'form-group'},React.createElement('label',null,'Phone Number'),React.createElement('input',{value:phone,onChange:e=>setPhone(e.target.value),placeholder:'9XXXXXXX'})),
          React.createElement('div',{className:'form-group'},React.createElement('label',null,'Delivery Address'),React.createElement('input',{value:address,onChange:e=>setAddress(e.target.value),placeholder:'Street, area, city'}))
        )
      ),
      React.createElement('div',{className:'card'},
        React.createElement('div',{className:'card-title'},'Terms & Conditions'),
        React.createElement('div',{className:'form-grid'},
          React.createElement('div',{className:'form-row'},

function DemandTracker({user,data,setData,notify,switchToQuotation}){
  const BASE='https://mkaerp-production.up.railway.app';
  const [showModal,setShowModal]=useState(false);
  const [form,setForm]=useState({customerName:'',productId:'',phone:''});
  const [customerModal,setCustomerModal]=useState(null);
  const [sortBy,setSortBy]=useState('count');
  const [loading,setLoading]=useState(false);

  // demand entries stored in data.demandEntries (fetched from DB)
  const demandList=data.demandEntries||[];
  const active=demandList.filter(q=>!q.converted);

  const maxCount=Math.max(1,...Object.values(
    active.reduce((acc,q)=>{acc[q.product_id]=(acc[q.product_id]||0)+1;return acc},{})
  ));
  const productGroups={};
  active.forEach(q=>{
    const key=q.product_id;
    if(!productGroups[key])productGroups[key]=[];
    productGroups[key].push(q);
  });
  const sorted=Object.entries(productGroups).sort((a,b)=>
    sortBy==='count'?b[1].length-a[1].length:
    (a[1][0]?.product_name||'').localeCompare(b[1][0]?.product_name||'')
  );

  const addEntry=async()=>{
    if(!form.customerName.trim()||!form.productId){notify('Name and product required','error');return;}
    const prod=data.products.find(p=>p.id===Number(form.productId));
    if(!prod){notify('Product not found','error');return;}
    setLoading(true);
    try{
      const res=await fetch(BASE+'/demand-tracker',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          customer_name:form.customerName.trim(),
          phone:form.phone||'',
          product_id:prod.id,
          product_name:prod.name
        })
      });
      if(!res.ok)throw new Error(await res.text());
      const created=await res.json();
      setData(d=>({...d,demandEntries:[created,...(d.demandEntries||[])]}));
      notify('Added to demand tracker','success');
      setForm({customerName:'',productId:'',phone:''});
      setShowModal(false);
    }catch(e){console.error(e);notify('Failed to add entry','error');}
    setLoading(false);
  };

  const convertToQuotation=()=>{

    switchToQuotation({

        )
      ),

    ),
    sorted.length===0
      ?React.createElement('div',{className:'card'},React.createElement('div',{className:'empty'},React.createElement('div',{style:{fontSize:12,color:'var(--text3)'}},'No demand entries yet')))
      :sorted.map(([pid,customers])=>React.createElement('div',{key:pid,className:'quot-group'},

              React.createElement('div',{style:{fontSize:11,color:'var(--text3)',marginTop:1}},customers.length+' customer'+(customers.length>1?'s':'')+' interested')
            )
