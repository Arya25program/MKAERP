<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="./logo.png">
<title>MKA ERP</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Sora',sans-serif;font-size:14px;line-height:1.6;height:100vh;transition:background .2s,color .2s}
#root{height:100%;overflow:hidden;display:flex;flex-direction:column}
body.dark{--bg:#1a1a1a;--bg2:#222;--bg3:#2a2a2a;--bg4:#303030;--border:#333;--border2:#444;--text:#f0f0ee;--text2:#a0a09a;--text3:#666660;--green:#3dba78;--green-bg:#1e2e24;--amber:#d4a030;--amber-bg:#2e2618;--red:#d45c5c;--red-bg:#2e1e1e;--shadow:rgba(0,0,0,.3);--nav-bg:rgba(30,30,30,.88)}
body.light{--bg:#f4f4f0;--bg2:#ffffff;--bg3:#ededea;--bg4:#e4e4e0;--border:#d8d8d4;--border2:#c8c8c4;--text:#1a1a18;--text2:#5a5a56;--text3:#9a9a96;--green:#1f9a5e;--green-bg:#e8f7ef;--amber:#b07800;--amber-bg:#fef8e0;--red:#c04040;--red-bg:#fdf0f0;--shadow:rgba(0,0,0,.08);--nav-bg:rgba(255,255,255,.88)}
body.easter{--bg:#0C243D;--bg2:#27496A;--bg3:#1e3a56;--bg4:#2d5276;--border:#3a6080;--border2:#4a7090;--text:#C1D1DB;--text2:#9AB7CD;--text3:#5C8EB4;--green:#5CBBA0;--green-bg:#0e2a30;--amber:#d4a030;--amber-bg:#2e2618;--red:#e07070;--red-bg:#2e1e1e;--shadow:rgba(0,0,0,.5);--nav-bg:rgba(12,36,61,.92)}
body.easter .toggle-track{background:#3a6080}
body.easter .toggle-track.on{background:#5C8EB4}
body.easter .btn-primary{background:#C1D1DB;color:#0C243D}
body.easter .nav-item.active{border-left-color:#9AB7CD;background:#1e3a56;color:#C1D1DB}
body.easter .topbar-date{cursor:pointer;user-select:none}
body.easter .topbar-date:hover{opacity:.75}
body{background:var(--bg);color:var(--text)}
input,select,textarea{background:var(--bg3);border:1px solid var(--border2);color:var(--text);border-radius:10px;padding:9px 13px;width:100%;font-family:inherit;font-size:13px;outline:none;transition:border .2s,background .2s}
input:focus,select:focus,textarea:focus{border-color:var(--text3)}
button{cursor:pointer;font-family:inherit;border:none;border-radius:10px;font-size:13px;font-weight:500;transition:all .15s}
label{font-size:12px;color:var(--text2);display:block;margin-bottom:4px}
select option{background:var(--bg3);color:var(--text)}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:210px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:18px 0;flex-shrink:0;transition:background .2s}
.sidebar-logo{padding:0 18px 20px;border-bottom:1px solid var(--border)}
.logo-text{font-size:14px;font-weight:600;color:var(--text)}
.logo-sub{font-size:10px;color:var(--text3);font-family:'JetBrains Mono',monospace}
.nav{flex:1;padding:14px 0;overflow-y:auto}
.nav-section{font-size:10px;color:var(--text3);padding:10px 18px 5px;letter-spacing:.08em;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 18px;cursor:pointer;color:var(--text2);font-size:13px;transition:all .15s;border-left:2px solid transparent}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:var(--bg3);color:var(--text);border-left-color:var(--text);font-weight:500}
.sidebar-bottom{padding:10px 18px 14px;border-top:1px solid var(--border)}
.theme-toggle{display:flex;align-items:center;justify-content:space-between;padding:8px 0;margin-bottom:10px}
.theme-label{font-size:11px;color:var(--text3)}
.toggle-track{width:32px;height:18px;background:var(--bg4);border-radius:20px;position:relative;cursor:pointer;border:1px solid var(--border2);transition:background .2s}
.toggle-track.on{background:var(--text3)}
.toggle-thumb{width:12px;height:12px;border-radius:50%;background:var(--text);position:absolute;top:2px;left:2px;transition:left .2s}
.toggle-track.on .toggle-thumb{left:16px}
.user-chip{display:flex;align-items:center;gap:9px}
.avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;flex-shrink:0;background:var(--bg4);color:var(--text);border:1px solid var(--border2)}
.user-name{font-size:12px;font-weight:500;color:var(--text)}
.user-role{font-size:10px;color:var(--text3)}
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:13px 26px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.page-title{font-size:15px;font-weight:600;color:var(--text)}
.page-sub{font-size:11px;color:var(--text3);margin-top:1px}
.content{padding:22px 26px;flex:1}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:18px;transition:background .2s}
.card-title{font-size:13px;font-weight:600;margin-bottom:14px;color:var(--text)}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.metric{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:16px 18px}
.metric-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px}
.metric-value{font-size:22px;font-weight:600;font-family:'JetBrains Mono',monospace;line-height:1;color:var(--text)}
.metric-change{font-size:11px;margin-top:5px;color:var(--text3)}
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:500}
.badge.pending{background:var(--amber-bg);color:var(--amber)}
.badge.approved{background:var(--green-bg);color:var(--green)}
.badge.rejected{background:var(--red-bg);color:var(--red)}
.badge.new{background:var(--bg3);color:var(--text2)}
.badge.converted{background:var(--green-bg);color:var(--green)}
.badge.lost{background:var(--bg3);color:var(--text3)}
.badge.in-stock{background:var(--green-bg);color:var(--green)}
.badge.low-stock{background:var(--amber-bg);color:var(--amber)}
.badge.delivered{background:var(--green-bg);color:var(--green)}
.badge.scheduled{background:var(--amber-bg);color:var(--amber)}
.badge.unscheduled{background:var(--bg3);color:var(--text3)}
table{width:100%;border-collapse:collapse}
th{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;padding:7px 11px;text-align:left;border-bottom:1px solid var(--border)}
td{padding:10px 11px;border-bottom:1px solid var(--border);font-size:12px;color:var(--text2)}
td.primary{color:var(--text)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg3)}
.btn{padding:8px 16px;font-size:12px;font-weight:500;border-radius:10px;cursor:pointer;border:none}
.btn-primary{background:var(--text);color:var(--bg)}
.btn-primary:hover{opacity:.85}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border2)}
.btn-ghost:hover{border-color:var(--text3);color:var(--text)}
.btn-success{background:var(--green-bg);color:var(--green);border:1px solid rgba(61,186,120,.2)}
.btn-danger{background:var(--red-bg);color:var(--red);border:1px solid rgba(212,92,92,.2)}
.btn-amber{background:var(--amber-bg);color:var(--amber);border:1px solid rgba(212,160,48,.2)}
.btn-sm{padding:4px 10px;font-size:11px}
.form-grid{display:flex;flex-direction:column;gap:14px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-group{display:flex;flex-direction:column}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.login-wrap{display:flex;align-items:center;justify-content:center;height:100vh;overflow-y:auto;background:var(--bg)}
.login-card{width:360px;background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:36px}
.login-form{margin-top:24px;display:flex;flex-direction:column;gap:14px}
.demo-label{font-size:10px;color:var(--text3);margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em}
.role-btns{display:flex;gap:6px;flex-wrap:wrap}
.role-btn{padding:5px 10px;border-radius:7px;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);font-size:11px;cursor:pointer;transition:all .15s;font-family:'Sora',sans-serif}
.role-btn:hover{border-color:var(--text3);color:var(--text)}
.invoice-items{background:var(--bg3);border:1px solid var(--border2);border-radius:10px;overflow:hidden}
.item-row{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;padding:10px 14px;align-items:center;border-bottom:1px solid var(--border)}
.item-row:last-child{border-bottom:none}
.item-header{background:var(--bg4);font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em}
.empty{text-align:center;padding:40px;color:var(--text3)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;overflow-y:auto}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:16px;padding:24px 20px;width:100%;max-width:560px;max-height:85vh;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative;margin:auto}
.modal-title{font-size:14px;font-weight:600;margin-bottom:18px;color:var(--text)}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;padding-top:14px;border-top:1px solid var(--border);flex-wrap:wrap}
.modal-actions .btn{flex:1;min-width:80px;text-align:center;padding:11px 10px}
.notif{position:fixed;top:18px;right:18px;background:var(--bg2);border:1px solid var(--border2);border-radius:10px;padding:10px 14px;z-index:300;font-size:12px;display:flex;align-items:center;gap:9px;max-width:340px;box-shadow:0 4px 20px var(--shadow)}
.notif.success{border-color:var(--green)}
.notif.error{border-color:var(--red)}
.comment-box{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px;margin-top:10px}
.comment-meta{font-size:10px;color:var(--text3);margin-bottom:4px}
.comment-text{font-size:12px;color:var(--text2)}
.approval-banner{background:var(--green-bg);border:1px solid rgba(61,186,120,.25);border-radius:10px;padding:10px 14px;font-size:12px;color:var(--green)}
.rejection-banner{background:var(--red-bg);border:1px solid rgba(212,92,92,.25);border-radius:10px;padding:10px 14px;font-size:12px;color:var(--red)}
.back-btn{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text3);cursor:pointer;margin-bottom:16px;padding:6px 0}
.back-btn:hover{color:var(--text)}
.tag{display:inline-flex;padding:2px 8px;border-radius:6px;font-size:10px;background:var(--bg3);color:var(--text3);border:1px solid var(--border)}
.print-page{display:none}
@media print{
  body>*{display:none}
  .print-page{display:block!important;background:#fff;color:#111;font-family:'Sora',sans-serif;z-index:9999}
  .print-page .print-doc{box-sizing:border-box;padding:0;margin:0}
  .print-doc-break{page-break-before:always!important;break-before:page!important;display:block}
  @page{margin:0;size:A4}
}
.divider{border:none;border-top:1px solid var(--border);margin:14px 0}
/* circular progress */
.circ-wrap{position:relative;width:48px;height:48px;flex-shrink:0}
.circ-wrap svg{transform:rotate(-90deg)}
.circ-wrap .circ-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;font-family:'JetBrains Mono',monospace;color:var(--text)}
/* quot product card */
.quot-group{background:var(--bg3);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
.quot-chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg4);border:1px solid var(--border2);border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer;transition:background .15s}
.quot-chip:hover{background:var(--bg2)}
/* quot formal table */
.quot-table{width:100%;border-collapse:collapse;margin:12px 0}
.quot-table th{background:var(--bg3);font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;padding:8px 12px;text-align:left;border-bottom:1px solid var(--border)}
.quot-table td{padding:9px 12px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text2)}
.quot-table td.num{font-family:'JetBrains Mono',monospace;text-align:right}
.quot-table tr:last-child td{border-bottom:none}
.quot-total-row td{font-weight:600;color:var(--text);background:var(--bg3)}
.sect-title{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px;margin-top:20px}
/* Dev Admin AI Panel */
.dev-ai-box{background:var(--bg3);border:1px solid var(--border2);border-radius:10px;padding:8px 10px;margin-bottom:10px}
.dev-ai-label{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;display:flex;align-items:center;gap:4px}
.dev-ai-label span{width:6px;height:6px;background:var(--green);border-radius:50%;display:inline-block;animation:devpulse 2s infinite}
@keyframes devpulse{0%,100%{opacity:1}50%{opacity:.4}}
.dev-ai-row{display:flex;gap:5px;align-items:center}
.dev-ai-input{flex:1;font-size:11px;padding:5px 8px;border-radius:7px;background:var(--bg2);border:1px solid var(--border2);color:var(--text);outline:none;min-width:0}
.dev-ai-input:focus{border-color:var(--text3)}
.dev-ai-btn{padding:5px 8px;border-radius:7px;background:var(--text);color:var(--bg);font-size:11px;border:none;cursor:pointer;flex-shrink:0;font-weight:600;transition:opacity .15s}
.dev-ai-btn:hover{opacity:.8}
/* AI Chat Popup */
.dev-chat-overlay{position:fixed;inset:0;z-index:500;pointer-events:none}
.dev-chat-popup{position:fixed;bottom:20px;left:220px;width:360px;height:500px;background:var(--bg2);border:1px solid var(--border2);border-radius:14px;display:flex;flex-direction:column;z-index:501;box-shadow:0 8px 40px rgba(0,0,0,.35);pointer-events:all;overflow:hidden}
.dev-chat-header{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:var(--bg3)}
.dev-chat-title{font-size:12px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:6px}
.dev-chat-close{width:22px;height:22px;border-radius:6px;background:var(--bg4);border:1px solid var(--border2);color:var(--text2);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.dev-chat-close:hover{color:var(--text);border-color:var(--text3)}
.dev-chat-messages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.dev-chat-messages::-webkit-scrollbar{width:4px}
.dev-chat-messages::-webkit-scrollbar-track{background:transparent}
.dev-chat-messages::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
.chat-msg{max-width:88%;font-size:12px;line-height:1.5;padding:8px 11px;border-radius:10px;word-break:break-word}
.chat-msg.user{background:var(--bg4);color:var(--text);align-self:flex-end;border-bottom-right-radius:3px}
.chat-msg.ai{background:var(--bg3);color:var(--text);align-self:flex-start;border-bottom-left-radius:3px;border:1px solid var(--border)}
.chat-msg.ai.thinking{color:var(--text3);font-style:italic}
.chat-msg-meta{font-size:9px;color:var(--text3);margin-top:3px}
.dev-chat-bottom{padding:10px;border-top:1px solid var(--border);display:flex;gap:6px;flex-shrink:0;background:var(--bg2)}
.dev-chat-bottom input{flex:1;font-size:12px;padding:7px 10px;border-radius:8px;background:var(--bg3);border:1px solid var(--border2);color:var(--text);outline:none}
.dev-chat-bottom input:focus{border-color:var(--text3)}
.dev-chat-send{padding:7px 12px;border-radius:8px;background:var(--text);color:var(--bg);font-size:12px;border:none;cursor:pointer;font-weight:600;transition:opacity .15s;flex-shrink:0}
.dev-chat-send:hover{opacity:.8}
.dev-chat-send:disabled{opacity:.4;cursor:not-allowed}
.mini-grid {display: grid;grid-template-columns: repeat(4, 1fr);gap: 12px;}
.mini-card {background: #1e1e1e;border-radius: 10px;padding: 10px;min-height: 70px;display: flex;flex-direction: column;justify-content: space-between;}
.mini-title {
  font-size: 12px;
  opacity: 0.7;
}

.mini-content {
  display: flex;
  justify-content: flex-end;
  align-items: center;
}

/* Button */
.mini-btn {
  background: #333;
  border: none;
  padding: 6px 10px;
  border-radius: 6px;
  color: white;
  cursor: pointer;
}

/* Toggle */
.toggle {
  width: 36px;
  height: 18px;
  background: #444;
  border-radius: 20px;
  position: relative;
  cursor: pointer;
}

.toggle-knob {
  width: 14px;
  height: 14px;
  background: white;
  border-radius: 50%;
  position: absolute;
  top: 2px;
  left: 2px;
  transition: 0.2s;
}

/* ── MOBILE BOTTOM NAV BAR ── */
.mobile-nav{
  display:none;
  position:fixed;
  bottom:0;left:0;right:0;
  background:var(--nav-bg,rgba(26,26,26,.97));
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--border);
  z-index:250;
  padding:6px 8px 10px;
  gap:2px;
  align-items:stretch;
  justify-content:space-around;
  box-shadow:0 -4px 20px rgba(0,0,0,.25);
}
body.light .mobile-nav{background:rgba(255,255,255,.97)}
.mob-item{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:8px 6px;border-radius:12px;cursor:pointer;
  color:var(--text3);font-size:10px;font-weight:500;
  flex:1;min-width:0;max-width:80px;
  transition:all .18s;font-family:'Sora',sans-serif;
  border:none;background:transparent;
}
.mob-item.active{background:var(--bg3);color:var(--text)}
.mob-item:not(.active):hover{background:var(--bg3);color:var(--text2)}
.mob-icon{font-size:20px;line-height:1.2;display:block}
.mob-label{font-size:10px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:64px}

/* ── MOBILE PROFILE BUTTON ── */
.mob-profile-btn{
  display:none;align-items:center;gap:8px;
  background:var(--bg3);border:1px solid var(--border2);
  border-radius:20px;padding:5px 10px 5px 5px;cursor:pointer;
  transition:all .15s;
}
.mob-profile-btn:hover{border-color:var(--text3)}
.mob-theme-btn{
  display:none;align-items:center;justify-content:center;
  width:34px;height:34px;
  background:var(--bg3);border:1px solid var(--border2);
  border-radius:50%;cursor:pointer;font-size:16px;
  transition:all .15s;flex-shrink:0;
}
.mob-theme-btn:hover{border-color:var(--text3)}
.mob-profile-avatar{width:26px;height:26px;border-radius:50%;background:var(--bg4);color:var(--text);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;flex-shrink:0}
.mob-profile-name{font-size:11px;font-weight:500;color:var(--text)}

/* ── MOBILE PROFILE SHEET — stays as bottom sheet intentionally ── */
.mob-profile-sheet{
  position:fixed;inset:0;z-index:400;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.55);
  padding:20px;
}
.mob-profile-inner{
  background:var(--bg2);border:1px solid var(--border2);
  border-radius:16px;width:100%;max-width:400px;padding:24px 20px 28px;
}
.mob-profile-header{display:flex;align-items:center;gap:14px;margin-bottom:24px;padding-bottom:18px;border-bottom:1px solid var(--border)}
.mob-big-avatar{width:52px;height:52px;border-radius:50%;background:var(--bg4);color:var(--text);border:2px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700}
.mob-profile-info-name{font-size:16px;font-weight:600;color:var(--text)}
.mob-profile-info-role{font-size:12px;color:var(--text3);margin-top:2px}
.mob-profile-info-email{font-size:11px;color:var(--text3);margin-top:2px}

/* ── TABLE SCROLL ── */
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px}

/* ── USERS TABLE ACTIONS — ALWAYS VISIBLE ── */
.user-actions{display:flex;gap:5px;flex-wrap:wrap;align-items:center}

/* ── IMPORT CHOICE CARDS ── */
.import-choice{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:4px}
.import-opt{border:2px solid var(--border2);border-radius:14px;padding:22px 16px;cursor:pointer;text-align:center;transition:all .2s;background:var(--bg3)}

<body class="dark">
<div id="root"></div>
<div class="print-page" id="print-area"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const {useState,useEffect,useRef}=React;
// ── COMPANY CONSTANTS (VATIN & VAT are fixed for all documents) ──
const COMPANY_VATIN = 'OM1100144996';   // ← VATIN
const COMPANY_VAT_NO = 'OM1100037509';  // ← VAT No
function normalize(s){return String(s||'').toLowerCase().trim().replace(/[^a-z0-9]/g,' ').replace(/\s+/g,' ')}

const LEADS_INIT = [];
const DOCUMENTS_INIT = [];

function genId(p){return p+'-'+Date.now().toString(36).toUpperCase()}
function fmtCurrency(n){return 'OMR '+parseFloat(n||0).toFixed(2)}
function getInitials(n){return n.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase()}
function genPasscode(role){const r={owner:'Own',employee:'Emp',admin:'Adm',accountant:'Acc'};return `${r[role]||'Usr'}@${Math.floor(1000+Math.random()*9000)}${String.fromCharCode(65+Math.floor(Math.random()*26))}`}
function tsNow(){return new Date().toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}
function CircleProgress({count,max,size=48}){
  const r=18,circ=2*Math.PI*r;
  const pct=max>0?count/max:0;
  const dash=circ*pct;
  return React.createElement('div',{className:'circ-wrap',style:{width:size,height:size}},
    React.createElement('svg',{width:size,height:size,viewBox:'0 0 44 44'},
      React.createElement('circle',{cx:22,cy:22,r:r,fill:'none',stroke:'var(--bg4)',strokeWidth:4}),
      React.createElement('circle',{cx:22,cy:22,r:r,fill:'none',stroke:'var(--green)',strokeWidth:4,strokeDasharray:`${dash} ${circ}`,strokeLinecap:'round'})
    ),
    React.createElement('div',{className:'circ-label',style:{fontSize:size<44?11:13}},count)
  );
}

function generateDocumentHTML(data, type="quotation") {

  const products = data.products || data.items || [];

  const rows = products.map((p,i)=>`
    <tr>
      <td>${i+1}</td>
      <td>${p.name}</td>
      <td>${p.name}</td>
      <td class="r">OMR ${Number(p.price).toFixed(2)}</td>
      <td class="c">${p.qty}</td>
      <td class="r">OMR ${(p.price*p.qty).toFixed(2)}</td>
    </tr>
  `).join('');

  const subtotal = products.reduce((s,p)=>s+(p.price*p.qty),0);
  const discPct = Number(data.discountPct || 0);
  const discTitle = data.discountTitle || '';
  const discAmt = subtotal * (discPct/100);
  const afterDiscount = subtotal - discAmt;
  const vat = afterDiscount*0.05;
  const total = afterDiscount+vat;

  const vatinLine = `<div><b>VATIN:</b> ${COMPANY_VATIN}</div>`;
  const vatNoLine = `<div><b>VAT No:</b> ${COMPANY_VAT_NO}</div>`;
  const lpoLine = data.lpoNo ? `<div><b>LPO No:</b> ${data.lpoNo}</div>` : '';
  const lpoDateLine = data.lpoDate ? `<div><b>LPO Date:</b> ${data.lpoDate}</div>` : '';

  return `
  <div class="doc">

    <!-- HEADER -->
    <div class="doc-header">

      <div class="logo-box">
        <img src="https://raw.githubusercontent.com/Arya25program/MKAERP/main/companylogo.png" style="width:200px;height:auto;">
      </div>

      <div class="title-box">
        <div class="doc-top">
          <div>${new Date().toLocaleString()}</div>
          <div>MKA ERP</div>
        </div>

        <div class="doc-title">${type==='invoice'?'TAX INVOICE':type.toUpperCase()}</div>
      </div>

    </div>

    <div class="line"></div>

    <!-- CUSTOMER -->
    <div class="box">
      <div>
        <div class="label">CUSTOMER</div>
        <b>${data.name || data.customerName}</b>
        <div>${data.companyName || ''}</div>
        <div>Ref: ${data.customerRef || '-'}</div>
        <div>${data.address || data.customerAddress || ''}</div>
        ${data.customerPhone ? `<div>Phone: ${data.customerPhone}</div>` : ''}
        ${vatinLine}${vatNoLine}
      </div>

      <div class="right-box">
        <div><b>Date:</b> ${data.date || data.created}</div>
        <div><b>${type==='invoice'?'Invoice':'Quotation'} Ref:</b> ${data.id}</div>
        ${lpoLine}${lpoDateLine}
      </div>
    </div>

    <!-- TABLE -->
    <table class="doc-table">
      <thead>
        <tr>
          <th>S.NO</th>
          <th>MODEL</th>
          <th>DESCRIPTION</th>
          <th class="r">UNIT PRICE</th>
          <th class="c">QTY</th>
          <th class="r">TOTAL</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>

    <!-- TOTAL -->
    <div class="totals">
      <div>Subtotal <span>OMR ${subtotal.toFixed(2)}</span></div>
      ${discAmt>0?`<div style="color:#c04040;">${discTitle?discTitle:'Discount'} (${discPct}%) <span>- OMR ${discAmt.toFixed(2)}</span></div>`:''}
      <div>VAT 5% <span>OMR ${vat.toFixed(2)}</span></div>
      <div class="grand">Gross Total <span>OMR ${total.toFixed(2)}</span></div>
    </div>

    <div class="signature-section">

      <!-- LEFT (STAMP AREA) -->
      <div class="sign-box left">
        <div class="sign-label">Accounts Signature</div>
        <div class="sign-line"></div>
      </div>

      <!-- RIGHT (SIGNATURE) -->
      <div class="sign-box right">
        <div class="sign-label">Customer's Signature</div>

function printWithImages(html) {
  const container = document.getElementById("print-area");
  container.innerHTML = html;

  const images = container.querySelectorAll("img");
  let loaded = 0;

  if (images.length === 0) {
    window.print();
    return;
  }

  images.forEach(img => {
    if (img.complete) {
      loaded++;
      if (loaded === images.length) window.print();
    } else {
      img.onload = () => {
        loaded++;
        if (loaded === images.length) window.print();
      };
      img.onerror = () => {
        loaded++;
        if (loaded === images.length) window.print();
      };
    }
  });
}

function Login({onLogin,users,theme,setTheme}){
  const [email,setEmail]=useState('');
  const [pass,setPass]=useState('');
  const [err,setErr]=useState('');
  const [loading,setLoading]=useState(false); 

  const handle = () => {
    setErr('');
    setLoading(true);

    fetch("https://mkaerp-production.up.railway.app/login", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        email: email,
        password: pass
      })
    })
    .then(async res => {
      if (!res.ok) {
        const text = await res.text();
        throw new Error(text || "Login failed");
      }
      return res.json();
    })
    .then(user => {
      if (!user.active) {
        setErr("Account disabled.");
        setLoading(false);
        return;
      }

      console.log("Logged in user:", user);
      onLogin(user);
      setLoading(false);
    })
    .catch(err => {
      console.error(err);
      setErr(err.message || "Invalid credentials.");
      setLoading(false); // ✅ FIX 2
    });
  };

  // ✅ SAFE GROUPING (no crash if users empty)
  const grouped={};
  if(users && users.length){
    users.forEach(u=>{
      if(!grouped[u.role])grouped[u.role]=[];
      grouped[u.role].push(u);
    });

  const roleLabels={
    owner:'Owners',

        ),
        React.createElement('div',{style:{display:'flex',alignItems:'center',gap:7,fontSize:11,color:'var(--text3)'}},

          React.createElement('div',{

function ApprovalsPage({user,data,setData,notify}){
  const pending=(data.documents||[]).filter(d=>d.type==='invoice'&&d.status==='pending');
  const [rejModal,setRejModal]=useState(null);
  const [rejNote,setRejNote]=useState('');
  const approve = (id) => {
    fetch(`https://mkaerp-production.up.railway.app/approve/${id}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ approver: user.name })

      return text;

      setData(d => ({
        ...d,

function FormalQuotations({user,data,setData,notify}){
  const [showForm,setShowForm]=useState(false);
  const [editQ,setEditQ]=useState(null);
  const [viewQ,setViewQ]=useState(null);
  const [search, setSearch] = useState("");
  const [mkaRef, setMkaRef] = useState('');
  const [showDropdown, setShowDropdown] = useState(null);
  const empty={name:'',customerRef:'',promoCode:'',companyName:'',date:new Date().toISOString().split('T')[0],products:[{name:'',price:'',qty:1}],terms:{payment:'50% advance, 50% on delivery',delivery:'Within 7 working days',warranty:'1 year manufacturer warranty',validity:'Valid for 30 days'}};
  const [form,setForm]=useState(empty);
  const [discountPct,setDiscountPct]=useState('');
  const [discountTitle,setDiscountTitle]=useState('');
  const updateProd=(idx,field,val)=>setForm(f=>({...f,products:f.products.map((p,i)=>i===idx?{...p,[field]:val}:p)}));
  const addProdRow=()=>setForm(f=>({...f,products:[...f.products,{name:'',price:'',qty:1}]}));
  const removeProdRow=idx=>setForm(f=>({...f,products:f.products.filter((_,i)=>i!==idx)}));
  const subTotal=form.products.reduce((s,p)=>s+(parseFloat(p.price||0)*parseInt(p.qty||0)),0);
  const discountAmt=subTotal*(parseFloat(discountPct||0)/100);
  const discountedSubTotal=subTotal-discountAmt;
  const vat=discountedSubTotal*0.05;
  const gross=discountedSubTotal+vat;
  const save = (mode = "quotation") => {
    if (!form.name.trim()) {
      notify("Customer name required", "error");
      return;
    }
    const valid = form.products.filter(p => p.name && p.price); 
    if (!valid.length) {
      notify("Add at least one product", "error");
      return;
    }
    const builtItems = valid.map(p => ({
      productId: p.id || null,
      name: p.name,
      qty: parseInt(p.qty || 1),
      price: parseFloat(p.price)
    }));

    const qId = editQ ? editQ.id : genId("QUO");
    const payload = {
      id: qId,
      type: "quotation",
      employee_id: user.id,
      customer_name: form.name,
      customer_phone: form.phone || "",
      customer_address: form.address || "",
      customer_ref: form.customerRef || "",
      mka_ref: mkaRef || "",
      company_name: form.companyName || "",
      promo_code: form.promoCode || "",
      lpo_no: "",
      lpo_date: form.date || "",
      status: "draft",
      total: gross,
      created: new Date().toISOString(),
      terms: form.terms,
      items: builtItems,
      discount_pct: parseFloat(discountPct||0),
      discount_title: discountTitle||''
    };

    fetch("https://mkaerp-production.up.railway.app/documents", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    })
    .then(async res => {
      const text = await res.text();
      if (!res.ok) throw new Error(text);
      return text;
    })
    .then(() => {
      notify("Quotation saved", "success");

      const localQ = {
        id: qId,
        type: 'quotation',

    MiniBox('Mock Data Mode', ToggleSwitch()),

  );
}

function MiniBox(title, content) {
  return React.createElement('div', { className: 'mini-card' },
    React.createElement('div', { className: 'mini-title' }, title),
    React.createElement('div', { className: 'mini-content' }, content)
  );
}

function ToggleSwitch() {
  const [on, setOn] = React.useState(false);
  return React.createElement('div', {
    className: 'toggle',
    onClick: () => setOn(!on)
  },
    React.createElement('div', {
      className: 'toggle-knob',
      style: { transform: on ? 'translateX(16px)' : 'translateX(0)' }
    })
  );
}

function ActionButton(label) {
  return React.createElement('button', {
    className: 'mini-btn',
    onClick: () => alert(label + ' clicked')
  }, label);
}

function getOnboardingSteps(user) {
  const email = (user.email||'').toLowerCase();
  if(email === 'ram@mka.com') return ONBOARDING_STEPS.ram;
  if(email === 'asha@mka.com') return ONBOARDING_STEPS.asha;
  if(user.role === 'employee') return ONBOARDING_STEPS.employee;
  if(user.role === 'accountant') return ONBOARDING_STEPS.accountant;
  if(user.role === 'admin') return ONBOARDING_STEPS.admin;
  return ONBOARDING_STEPS.owner;
}

function OnboardingFlow({user, onComplete}) {
  const steps = getOnboardingSteps(user);
  const [step, setStep] = useState(0);
  const [completing, setCompleting] = useState(false);
  const current = steps[step];
  const isLast = step === steps.length - 1;

  function handleNext() {
    if(isLast) {
      finish();
    } else {
      setStep(s => s + 1);
    }
  }

  function finish() {
    if(completing) return;
    setCompleting(true);
    fetch('https://mkaerp-production.up.railway.app/users/'+user.id+'/complete-onboarding', {
      method: 'POST',
      headers: {'Content-Type':'application/json'}
    })
    .then(() => {
      const updatedUser = {...user, new_user: false};
      localStorage.setItem('user', JSON.stringify(updatedUser));
      onComplete(updatedUser);
    })
    .catch(() => {
      // Complete locally even if request fails
      const updatedUser = {...user, new_user: false};
      localStorage.setItem('user', JSON.stringify(updatedUser));
      onComplete(updatedUser);
    });
  }

  const getRoleLabel = () => {
    const email = (user.email||'').toLowerCase();
    if(email==='ram@mka.com') return 'Senior Owner';
    if(email==='asha@mka.com') return 'Owner';
    if(user.role==='admin') return 'Administrator';
    return user.role.charAt(0).toUpperCase()+user.role.slice(1);
  };

  return React.createElement('div', {className:'onboard-overlay'},
    React.createElement('div', {className:'onboard-card'},
      // Header
      React.createElement('div', null,
        React.createElement('div', {className:'onboard-logo'}, '⚙ MKA ERP'),
        React.createElement('div', {className:'onboard-subtitle'}, 'Welcome, '+user.name+' · '+getRoleLabel())
      ),

      // Progress dots
      React.createElement('div', {className:'onboard-step-pill'},
        steps.map((_, i) =>
          React.createElement('div', {
            key:i,
            className:'onboard-dot'+(i===step?' active':i<step?' done':'')
          })
        )
      ),

      // Step content
      React.createElement('div', null,
        React.createElement('span', {className:'onboard-icon'}, current.icon),
        React.createElement('div', {className:'onboard-feature-name'}, current.name),
        React.createElement('div', {className:'onboard-feature-desc'}, current.desc),

        // Screen preview
        React.createElement('div', {className:'onboard-screen'},
          React.createElement('div', {className:'onboard-screen-title'}, 'What you\'ll see'),
          current.preview.map((row, i) =>
            React.createElement('div', {key:i, className:'onboard-screen-row'},
              React.createElement('span', {className:'onboard-screen-icon'}, row.icon),
              React.createElement('span', null, row.label)
            )
          )
        )
      ),

      // Actions
      React.createElement('div', {className:'onboard-actions'},
        React.createElement('div', null,
          React.createElement('div', {className:'onboard-progress'}, (step+1)+' / '+steps.length),
          React.createElement('button', {className:'onboard-skip', onClick:finish}, completing?'Saving…':'Skip tour')
        ),
        React.createElement('button', {
          className:'onboard-next',
          onClick:handleNext,
          disabled:completing
        }, completing ? 'Starting…' : isLast ? 'Get Started →' : 'Next →')
      )
    )
  );
}

/* ─────────────────────────────────────────────
   EXPENDITURE APPROVALS PAGE
   For: Ramachandran (id:1) and Arya (id:10)
   ───────────────────────────────────────────── */
function ExpenditureApprovalsPage({user,data,setData,notify}){
  const BASE='https://mkaerp-production.up.railway.app';
  const [exps,setExps]=React.useState([]);
  const [loading,setLoading]=React.useState(true);
  const [tab,setTab]=React.useState('pending');
  const [rejectModal,setRejectModal]=React.useState(null);
  const [rejectNote,setRejectNote]=React.useState('');
  const [search,setSearch]=React.useState('');

  const fetchExps=()=>{
    setLoading(true);
    fetch(`${BASE}/expenditure`)
      .then(r=>r.json())
      .then(rows=>{
        const users=data.users||[];
        const umap={};
        users.forEach(u=>{umap[u.id]=u.name});
        setExps((rows||[]).map(e=>({...e,amount:Number(e.amount),employeeName:umap[e.user_id]||'User #'+e.user_id})));
        setLoading(false);
      })
      .catch(()=>{setLoading(false);notify('Failed to load expenditures','error')});
  };

  useEffect(()=>{fetchExps();},[]);

  const filtered=exps.filter(e=>{
    if(tab==='pending'&&e.status!=='pending')return false;
    if(tab==='approved'&&e.status!=='approved')return false;
    if(tab==='rejected'&&e.status!=='rejected')return false;
    if(search){
      const q=search.toLowerCase();
      if(!((e.employeeName||'').toLowerCase().includes(q)||(e.expense_type||'').toLowerCase().includes(q)||(e.used_for||'').toLowerCase().includes(q)||(e.description||'').toLowerCase().includes(q)))return false;
    }
    return true;
  });

  const doApprove=(id)=>{
    fetch(`${BASE}/expenditure/${id}/approve`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({approved_by:user.id})})
      .then(r=>{if(!r.ok)throw new Error();return r.json();})
      .then(()=>{notify('Expenditure approved','success');fetchExps();})
      .catch(()=>notify('Approval failed','error'));
  };

  const doReject=()=>{
    if(!rejectNote.trim()){notify('Please enter a reason','error');return;}
    fetch(`${BASE}/expenditure/${rejectModal}/reject`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({reason:rejectNote,approved_by:user.id})})
      .then(r=>{if(!r.ok)throw new Error();return r.json();})
      .then(()=>{notify('Expenditure rejected','success');setRejectModal(null);setRejectNote('');fetchExps();})
      .catch(()=>notify('Rejection failed','error'));
  };

  const totals={
    pending:exps.filter(e=>e.status==='pending').reduce((s,e)=>s+e.amount,0),
    approved:exps.filter(e=>e.status==='approved').reduce((s,e)=>s+e.amount,0),
    all:exps.reduce((s,e)=>s+e.amount,0),
    count:exps.filter(e=>e.status==='pending').length,
  };

  return React.createElement('div',null,
    // Stats
    React.createElement('div',{className:'exp-stat-grid'},
      [{label:'Pending Requests',val:totals.count,color:'var(--amber)'},
       {label:'Pending Amount',val:'OMR '+totals.pending.toFixed(2),color:'var(--amber)'},
       {label:'Approved Total',val:'OMR '+totals.approved.toFixed(2),color:'var(--green)'},
       {label:'All Expenditures',val:'OMR '+totals.all.toFixed(2),color:'var(--text)'},
      ].map((s,i)=>React.createElement('div',{key:i,className:'exp-stat'},
        React.createElement('div',{className:'exp-stat-label'},s.label),
        React.createElement('div',{className:'exp-stat-value',style:{color:s.color}},s.val)
      ))
    ),

    // Tabs + Search
    React.createElement('div',{style:{display:'flex',gap:10,flexWrap:'wrap',alignItems:'center',marginBottom:16}},
      React.createElement('div',{className:'exp-tabs',style:{marginBottom:0}},
        ['pending','approved','rejected','all'].map(t=>React.createElement('button',{
          key:t,className:`exp-tab${tab===t?' active':''}`,onClick:()=>setTab(t)
        },t.charAt(0).toUpperCase()+t.slice(1),t==='pending'&&totals.count>0?React.createElement('span',{style:{marginLeft:6,background:'var(--amber)',color:'#fff',borderRadius:20,padding:'1px 6px',fontSize:10}},totals.count):null))
      ),
      React.createElement('input',{
        style:{flex:1,minWidth:160,maxWidth:280},
        placeholder:'Search employee, type, purpose…',
        value:search,onChange:e=>setSearch(e.target.value)
      })
    ),

    // Table
    React.createElement('div',{className:'card'},
      loading?React.createElement('div',{className:'empty'},'Loading…'):
      filtered.length===0?React.createElement('div',{className:'empty'},'No expenditures found'):
      React.createElement('div',{className:'tbl-scroll'},
        React.createElement('table',{style:{minWidth:640}},
          React.createElement('thead',null,React.createElement('tr',null,
            ['Date','Employee','Type','Purpose','Amount','Proof','Status','Actions'].map(h=>React.createElement('th',{key:h},h))
          )),
          React.createElement('tbody',null,filtered.map(e=>React.createElement('tr',{key:e.id},
            React.createElement('td',null,(e.created_at||'').split('T')[0]),
            React.createElement('td',{className:'primary'},e.employeeName),
            React.createElement('td',null,React.createElement('span',{className:'exp-category-tag'},e.expense_type)),
            React.createElement('td',null,e.used_for||e.description||'—'),
            React.createElement('td',{style:{fontFamily:"'JetBrains Mono',monospace",fontWeight:600}},'OMR '+Number(e.amount).toFixed(2)),
            React.createElement('td',null,e.proof_url?React.createElement('a',{href:e.proof_url,target:'_blank',style:{color:'var(--green)',fontSize:11}},'View ↗'):'—'),
            React.createElement('td',null,React.createElement('span',{className:`badge ${e.status}`},e.status)),
            React.createElement('td',null,
              e.status==='pending'?React.createElement('div',{className:'exp-action-row'},
                React.createElement('button',{className:'approve-btn',onClick:()=>doApprove(e.id)},'✓ Approve'),
                React.createElement('button',{className:'reject-btn',onClick:()=>{setRejectModal(e.id);setRejectNote('')}},'✕ Reject')
              ):React.createElement('span',{style:{fontSize:10,color:'var(--text3)'}},e.approved_by?'By #'+e.approved_by:'—')
            )
          )))
        )
      )
    ),

    // Reject Modal
    rejectModal&&React.createElement('div',{className:'modal-overlay'},
      React.createElement('div',{className:'modal'},
        React.createElement('div',{className:'modal-title'},'Reject Expenditure'),
        React.createElement('div',{className:'form-group',style:{marginBottom:14}},
          React.createElement('label',null,'Reason for rejection'),
          React.createElement('textarea',{rows:3,value:rejectNote,onChange:e=>setRejectNote(e.target.value),placeholder:'Enter reason…',style:{resize:'vertical'}})
        ),
        React.createElement('div',{className:'modal-actions'},
          React.createElement('button',{className:'btn btn-ghost',onClick:()=>setRejectModal(null)},'Cancel'),
          React.createElement('button',{className:'btn btn-danger',onClick:doReject},'Reject')
        )
      )
    )
  );
}

/* ─────────────────────────────────────────────
   EXPENDITURE TRACKER PAGE
   For: accountant + Arya (id:10)
   ───────────────────────────────────────────── */
function ExpenditureTrackerPage({user,data,setData,notify}){
  const BASE='https://mkaerp-production.up.railway.app';
  const [exps,setExps]=React.useState([]);
  const [loading,setLoading]=React.useState(true);
  const [showForm,setShowForm]=React.useState(false);
  const [editExp,setEditExp]=React.useState(null);
  const [filterEmployee,setFilterEmployee]=React.useState('');
  const [filterType,setFilterType]=React.useState('');
  const [filterStatus,setFilterStatus]=React.useState('');
  const [filterPlate,setFilterPlate]=React.useState('');
  const [search,setSearch]=React.useState('');

  const EXPENSE_TYPES=['Petty Cash','Fuel','Maintenance','Office Supplies','Vehicle Repair','Toll/Parking','Utilities','Other'];

  const emptyForm={user_id:'',amount:'',expense_type:'',description:'',used_for:'',proof_url:'',car_plate:'',category:'',is_petty_cash:false};
  const [form,setForm]=React.useState(emptyForm);

  const fetchExps=()=>{
    setLoading(true);
    fetch(`${BASE}/expenditure`)
      .then(r=>r.json())
      .then(rows=>{
        const users=data.users||[];
        const umap={};
        users.forEach(u=>{umap[u.id]=u.name});
        setExps((rows||[]).map(e=>({...e,amount:Number(e.amount),employeeName:umap[e.user_id]||'User #'+e.user_id})));
        setLoading(false);
      })
      .catch(()=>{setLoading(false);notify('Failed to load expenditures','error')});
  };

  useEffect(()=>{fetchExps();},[]);

  const setF=(k,v)=>setForm(f=>({...f,[k]:v}));

  const openAdd=()=>{setForm(emptyForm);setEditExp(null);setShowForm(true)};
  const openEdit=(e)=>{
    setForm({user_id:e.user_id,amount:e.amount,expense_type:e.expense_type,description:e.description||'',used_for:e.used_for||'',proof_url:e.proof_url||'',car_plate:e.car_plate||'',category:e.category||'',is_petty_cash:!!e.is_petty_cash});
    setEditExp(e);setShowForm(true);
  };

  const handleSave=()=>{
    if(!form.user_id||!form.amount||!form.expense_type){notify('Fill required fields','error');return;}
    const body={...form,amount:Number(form.amount),user_id:Number(form.user_id)};
    const url=editExp?`${BASE}/expenditure/${editExp.id}`:`${BASE}/expenditure`;
    const method=editExp?'PUT':'POST';
    fetch(url,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
      .then(r=>{if(!r.ok)throw new Error();return r.json();})
      .then(()=>{notify(editExp?'Expenditure updated':'Expenditure added','success');setShowForm(false);fetchExps();})
      .catch(()=>notify('Save failed','error'));
  };

  const handleDelete=(id)=>{
    if(!window.confirm('Delete this expenditure?'))return;
    fetch(`${BASE}/expenditure/${id}`,{method:'DELETE'})
      .then(r=>{if(!r.ok)throw new Error();return r.json();})
      .then(()=>{notify('Deleted','success');fetchExps();})
      .catch(()=>notify('Delete failed','error'));
  };

  // Unique car plates from existing records
  const allPlates=[...new Set(exps.map(e=>e.car_plate).filter(Boolean))];
  const allEmployees=data.users||[];

  const filtered=exps.filter(e=>{
    if(filterEmployee&&String(e.user_id)!==filterEmployee)return false;
    if(filterType&&e.expense_type!==filterType)return false;
    if(filterStatus&&e.status!==filterStatus)return false;
    if(filterPlate&&(e.car_plate||'').toLowerCase()!==filterPlate.toLowerCase())return false;
    if(search){
      const q=search.toLowerCase();
      if(!((e.employeeName||'').toLowerCase().includes(q)||(e.expense_type||'').toLowerCase().includes(q)||(e.used_for||'').toLowerCase().includes(q)||(e.car_plate||'').toLowerCase().includes(q)||(e.description||'').toLowerCase().includes(q)))return false;
    }
    return true;
  });

  const totals={
    total:filtered.reduce((s,e)=>s+e.amount,0),
    petty:filtered.filter(e=>e.is_petty_cash||e.expense_type==='Petty Cash').reduce((s,e)=>s+e.amount,0),
    pending:filtered.filter(e=>e.status==='pending').length,
    approved:filtered.filter(e=>e.status==='approved').reduce((s,e)=>s+e.amount,0),
  };

  const hasFilters=filterEmployee||filterType||filterStatus||filterPlate||search;

  return React.createElement('div',null,

    // Header row
    React.createElement('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:18,flexWrap:'wrap',gap:10}},
      React.createElement('div',{style:{fontSize:13,color:'var(--text2)'}},`Showing ${filtered.length} of ${exps.length} records`),
      React.createElement('button',{className:'btn btn-primary',onClick:openAdd},'+ Add Expenditure')
    ),

    // Stats
    React.createElement('div',{className:'exp-stat-grid',style:{marginBottom:18}},
      [{label:'Total (Filtered)',val:'OMR '+totals.total.toFixed(2),color:'var(--text)'},
       {label:'Petty Cash',val:'OMR '+totals.petty.toFixed(2),color:'var(--amber)'},
       {label:'Approved Value',val:'OMR '+totals.approved.toFixed(2),color:'var(--green)'},
       {label:'Pending Approvals',val:totals.pending,color:'var(--amber)'},
      ].map((s,i)=>React.createElement('div',{key:i,className:'exp-stat'},
        React.createElement('div',{className:'exp-stat-label'},s.label),
        React.createElement('div',{className:'exp-stat-value',style:{color:s.color}},s.val)
      ))
    ),

    // Filters
    React.createElement('div',{className:'card',style:{marginBottom:16,padding:'14px 16px'}},
      React.createElement('div',{style:{fontSize:11,fontWeight:600,color:'var(--text3)',marginBottom:10,textTransform:'uppercase',letterSpacing:'.06em'}},'Filters'),
      React.createElement('div',{className:'exp-filter-bar'},
        React.createElement('input',{placeholder:'Search…',value:search,onChange:e=>setSearch(e.target.value),style:{flex:'1 1 140px',maxWidth:220}}),
        React.createElement('select',{value:filterEmployee,onChange:e=>setFilterEmployee(e.target.value),style:{flex:'1 1 130px',maxWidth:180}},
          React.createElement('option',{value:''},'All Employees'),
          allEmployees.map(u=>React.createElement('option',{key:u.id,value:String(u.id)},u.name))
        ),
        React.createElement('select',{value:filterType,onChange:e=>setFilterType(e.target.value),style:{flex:'1 1 130px',maxWidth:180}},
          React.createElement('option',{value:''},'All Types'),
          EXPENSE_TYPES.map(t=>React.createElement('option',{key:t,value:t},t))
        ),
        React.createElement('select',{value:filterPlate,onChange:e=>setFilterPlate(e.target.value),style:{flex:'1 1 130px',maxWidth:180}},
          React.createElement('option',{value:''},'All Plates'),
          allPlates.map(p=>React.createElement('option',{key:p,value:p},p))
        ),
        React.createElement('select',{value:filterStatus,onChange:e=>setFilterStatus(e.target.value),style:{flex:'1 1 110px',maxWidth:150}},
          React.createElement('option',{value:''},'All Status'),
          ['pending','approved','rejected'].map(s=>React.createElement('option',{key:s,value:s},s.charAt(0).toUpperCase()+s.slice(1)))
        ),
        hasFilters&&React.createElement('button',{className:'btn btn-ghost btn-sm',onClick:()=>{setFilterEmployee('');setFilterType('');setFilterStatus('');setFilterPlate('');setSearch('')}},'✕ Clear')
      )
    ),

    // Table
    React.createElement('div',{className:'card'},
      loading?React.createElement('div',{className:'empty'},'Loading…'):
      filtered.length===0?React.createElement('div',{className:'empty'},'No records match filters'):
      React.createElement('div',{className:'tbl-scroll'},
        React.createElement('table',{style:{minWidth:760}},
          React.createElement('thead',null,React.createElement('tr',null,
            ['Date','Employee','Type','Purpose','Car Plate','Amount','Petty Cash','Proof','Status','Actions'].map(h=>React.createElement('th',{key:h},h))
          )),
          React.createElement('tbody',null,filtered.map(e=>React.createElement('tr',{key:e.id},
            React.createElement('td',null,(e.created_at||'').split('T')[0]),
            React.createElement('td',{className:'primary'},e.employeeName),
            React.createElement('td',null,React.createElement('span',{className:'exp-category-tag'},e.expense_type)),
            React.createElement('td',null,e.used_for||e.description||'—'),
            React.createElement('td',{style:{fontFamily:"'JetBrains Mono',monospace",fontSize:11}},e.car_plate||'—'),
            React.createElement('td',{style:{fontFamily:"'JetBrains Mono',monospace",fontWeight:600}},'OMR '+Number(e.amount).toFixed(2)),
            React.createElement('td',null,(e.is_petty_cash||e.expense_type==='Petty Cash')?React.createElement('span',{className:'badge pending'},'Yes'):React.createElement('span',{style:{color:'var(--text3)',fontSize:11}},'No')),
            React.createElement('td',null,e.proof_url?React.createElement('a',{href:e.proof_url,target:'_blank',style:{color:'var(--green)',fontSize:11}},'View ↗'):'—'),
            React.createElement('td',null,React.createElement('span',{className:`badge ${e.status}`},e.status)),
            React.createElement('td',null,React.createElement('div',{className:'exp-action-row'},
              React.createElement('button',{className:'btn btn-ghost btn-sm',onClick:()=>openEdit(e)},'Edit'),
              React.createElement('button',{className:'btn btn-danger btn-sm',onClick:()=>handleDelete(e.id)},'Del')
            ))
          )))
        )
      )
    ),

    // Add/Edit Modal
    showForm&&React.createElement('div',{className:'modal-overlay'},
      React.createElement('div',{className:'modal'},
        React.createElement('div',{className:'modal-title'},editExp?'Edit Expenditure':'Add Expenditure'),
        React.createElement('div',{className:'form-grid'},
          React.createElement('div',{className:'form-row'},
            React.createElement('div',{className:'form-group'},
              React.createElement('label',null,'Employee *'),
              React.createElement('select',{value:form.user_id,onChange:e=>setF('user_id',e.target.value)},
                React.createElement('option',{value:''},'Select…'),
                (data.users||[]).map(u=>React.createElement('option',{key:u.id,value:u.id},u.name))
              )
            ),
            React.createElement('div',{className:'form-group'},
              React.createElement('label',null,'Amount (OMR) *'),
              React.createElement('input',{type:'number',step:'0.01',min:0,value:form.amount,onChange:e=>setF('amount',e.target.value),placeholder:'0.000'})
            )
          ),
          React.createElement('div',{className:'form-row'},
            React.createElement('div',{className:'form-group'},
              React.createElement('label',null,'Expense Type *'),
              React.createElement('select',{value:form.expense_type,onChange:e=>setF('expense_type',e.target.value)},
                React.createElement('option',{value:''},'Select type…'),
                EXPENSE_TYPES.map(t=>React.createElement('option',{key:t,value:t},t))
              )
            ),
            React.createElement('div',{className:'form-group'},
              React.createElement('label',null,'Car Plate No.'),
              React.createElement('input',{value:form.car_plate,onChange:e=>setF('car_plate',e.target.value),placeholder:'e.g. 12345 A'})
            )
          ),
          React.createElement('div',{className:'form-group'},
            React.createElement('label',null,'Used For / Purpose'),
            React.createElement('input',{value:form.used_for,onChange:e=>setF('used_for',e.target.value),placeholder:'e.g. Client delivery, Office run…'})
          ),
          React.createElement('div',{className:'form-group'},
            React.createElement('label',null,'Description / Notes'),
            React.createElement('textarea',{rows:2,value:form.description,onChange:e=>setF('description',e.target.value),placeholder:'Additional details…',style:{resize:'vertical'}})
          ),
          React.createElement('div',{className:'form-group'},
            React.createElement('label',null,'Proof URL (receipt image link)'),
            React.createElement('input',{value:form.proof_url,onChange:e=>setF('proof_url',e.target.value),placeholder:'https://…'})
          ),
          React.createElement('div',{style:{display:'flex',alignItems:'center',gap:10,padding:'4px 0'}},
            React.createElement('input',{type:'checkbox',id:'is_petty_cash',checked:!!form.is_petty_cash,onChange:e=>setF('is_petty_cash',e.target.checked),style:{width:'auto',marginRight:4}}),
            React.createElement('label',{htmlFor:'is_petty_cash',style:{marginBottom:0,cursor:'pointer'}},'Mark as Petty Cash')
          )
        ),
        React.createElement('div',{className:'modal-actions'},
          React.createElement('button',{className:'btn btn-ghost',onClick:()=>setShowForm(false)},'Cancel'),
          React.createElement('button',{className:'btn btn-primary',onClick:handleSave},editExp?'Save Changes':'Add Expenditure')
        )
      )
    )
  );
}
